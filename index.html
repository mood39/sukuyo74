<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宿曜 · 七政四餘 合盤</title>
<style>
:root{
  --gan:#0E1730;--gan2:#16223E;--gan3:#1E2C4C;
  --jin:#C8A44D;--jin2:#E3C67E;--shi:#5E90AE;--shi2:#8FBBD4;
  --zhu:#C0453A;--lv:#7FA98E;--juan:#E6DFC9;--mu:#8593AE;
  --line:rgba(200,164,77,.20);
  --serif:"Noto Serif TC","Songti TC","SimSun",serif;
  --sans:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--gan);background-image:radial-gradient(ellipse at 50% -10%,rgba(200,164,77,.10),transparent 60%);
  color:var(--juan);font-family:var(--sans);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 72px}
header{padding:26px 0 14px;border-bottom:1px solid var(--line)}
h1{font-family:var(--serif);font-size:24px;letter-spacing:.16em;margin:0;color:var(--jin2);font-weight:600}
.sub{color:var(--mu);font-size:12.5px;letter-spacing:.06em;margin-top:6px;line-height:1.6}
nav{display:flex;gap:2px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);
  font-family:var(--serif);font-size:14.5px;letter-spacing:.14em;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--jin2);border-bottom-color:var(--jin)}
section[hidden]{display:none}
.card{background:var(--gan2);border:1px solid var(--line);padding:16px 18px;margin:16px 0;border-radius:2px}
.card h2{font-family:var(--serif);font-size:16px;letter-spacing:.16em;color:var(--jin2);margin:0 0 12px;font-weight:500}
.card h3{font-family:var(--serif);font-size:14px;letter-spacing:.12em;color:var(--jin);margin:16px 0 8px;font-weight:500}
.plain{background:rgba(94,144,174,.10);border-left:3px solid var(--shi);padding:13px 16px;margin:16px 0;border-radius:2px}
.plain .ph{font-family:var(--serif);font-size:13px;letter-spacing:.14em;color:var(--shi2);margin-bottom:7px}
.plain .pb{font-size:13.5px;line-height:1.85;color:var(--juan)}
.plain .pb b{color:var(--jin2);font-weight:600}
label{display:block;font-size:12px;color:var(--mu);letter-spacing:.06em;margin-bottom:4px}
input,select{background:var(--gan);border:1px solid var(--line);color:var(--juan);font-family:var(--mono);
  font-size:15px;padding:8px 10px;border-radius:2px;width:100%}
input:focus,select:focus{outline:2px solid var(--jin)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1 1 72px;min-width:0}.row>div.w{flex:1 1 140px}
.toggle{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--mu)}
.toggle input{width:auto}
button.go{background:var(--jin);color:#14203A;border:0;font-family:var(--serif);font-size:15px;
  letter-spacing:.2em;padding:11px 26px;border-radius:2px;cursor:pointer;margin-top:14px;font-weight:600}
button.go:hover{background:var(--jin2)}
button.ghost{background:none;border:1px solid var(--line);color:var(--mu);font-size:12.5px;
  padding:7px 12px;border-radius:2px;cursor:pointer;margin-top:10px}
button.ghost:hover{color:var(--juan);border-color:var(--jin)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px;border-bottom:1px solid rgba(200,164,77,.12);vertical-align:top}
th{color:var(--mu);font-weight:400;font-size:11.5px;letter-spacing:.1em;white-space:nowrap}
tr.hi td{background:rgba(200,164,77,.07)}
td.su{font-family:var(--serif);font-size:17px;color:var(--jin2);white-space:nowrap}
td.qi{font-family:var(--serif);font-size:17px;color:var(--shi2);white-space:nowrap}
td.yu{font-family:var(--serif);font-size:17px;color:var(--zhu);white-space:nowrap}
td.num,.num{font-family:var(--mono);font-size:12.5px;color:var(--mu);white-space:nowrap}
td.num.neg{color:var(--zhu)}
.tiny{font-size:12px;color:var(--mu);line-height:1.65}
.note{font-size:12.5px;color:var(--mu);line-height:1.7}.note b{color:var(--juan);font-weight:500}
.big{font-family:var(--serif);font-size:36px;color:var(--jin2);letter-spacing:.1em;line-height:1.25}
.big .bigsub{font-size:16px;color:var(--mu);font-family:var(--sans);letter-spacing:.1em;margin-left:4px}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;padding:2px 7px;border:1px solid var(--line);
  border-radius:2px;color:var(--mu);margin-right:5px}
.tag.g{color:var(--lv);border-color:rgba(127,169,142,.42)}
.tag.r{color:var(--zhu);border-color:rgba(192,69,58,.45)}
.tag.j{color:var(--jin2);border-color:rgba(200,164,77,.45)}
.jing{font-family:var(--serif);font-size:14.5px;line-height:2;color:var(--juan)}
.zhu{color:var(--lv);font-size:12.5px;line-height:1.8}
.grid27{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:6px}
.cell{background:var(--gan);border:1px solid rgba(200,164,77,.14);padding:6px 2px;text-align:center;border-radius:2px}
.cell .s{font-family:var(--serif);font-size:16px;color:var(--jin2)}
.cell .l{font-size:10px;color:var(--mu)}
.cell.ming{border-color:var(--jin);background:rgba(200,164,77,.14)}
.cell.bad .l{color:var(--zhu)}.cell.good .l{color:var(--lv)}
svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mu);margin-top:10px}
.legend i{display:inline-block;width:16px;height:2px;vertical-align:middle;margin-right:5px}
.formula{font-family:var(--mono);font-size:12.5px;background:var(--gan);border:1px solid var(--line);
  padding:9px 12px;margin:9px 0;border-radius:2px;color:var(--jin2);line-height:1.7;overflow-x:auto}
.chk{font-family:var(--mono);font-size:11.5px;color:var(--mu);line-height:1.85}
.chk .p{color:var(--lv)}.chk .f{color:var(--zhu)}
.err{background:rgba(192,69,58,.14);border:1px solid rgba(192,69,58,.4);padding:10px 12px;font-size:12.5px;color:#F0B5AF;border-radius:2px}
footer{border-top:1px solid var(--line);margin-top:28px;padding-top:14px;font-size:11.5px;color:var(--mu);line-height:1.7}

.card h4{font-family:var(--sans);font-size:12px;letter-spacing:.12em;color:var(--shi2);margin:14px 0 6px;font-weight:500}
.bai{font-size:14px;line-height:1.9;color:var(--juan);background:rgba(94,144,174,.07);
  border-left:2px solid rgba(94,144,174,.4);padding:10px 13px;border-radius:2px}
.two{display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.two .lab{flex:0 0 108px;font-family:var(--serif);font-size:14px;color:var(--jin2);line-height:1.5}
.two .bai{flex:1 1 auto}
details.orig{margin-top:12px}
details.orig>summary{cursor:pointer;font-size:12px;letter-spacing:.1em;color:var(--mu);
  border:1px solid var(--line);padding:6px 11px;border-radius:2px;display:inline-block;list-style:none}
details.orig>summary::-webkit-details-marker{display:none}
details.orig>summary::before{content:"▸ "}
details.orig[open]>summary::before{content:"▾ "}
details.orig>summary:hover{color:var(--juan);border-color:var(--jin)}
details.item{border-bottom:1px solid rgba(200,164,77,.12);padding:4px 0}
details.item>summary{cursor:pointer;padding:9px 2px;list-style:none;display:flex;align-items:baseline;gap:12px}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary .isu{font-family:var(--serif);font-size:20px;color:var(--jin2);flex:0 0 34px}
details.item>summary .ihint{font-size:12px;color:var(--mu);overflow:hidden}
details.item[open]>summary .isu{color:var(--jin)}
.card.sum{background:linear-gradient(180deg,rgba(200,164,77,.14),rgba(22,34,62,.9));border-color:rgba(200,164,77,.4)}
.sumrow{display:flex;align-items:baseline;gap:14px;padding:7px 0;border-bottom:1px solid rgba(200,164,77,.12)}
.sumrow .k{flex:0 0 104px;font-size:12px;color:var(--mu);letter-spacing:.08em}
.sumrow .v{font-family:var(--serif);font-size:30px;color:var(--jin2);line-height:1.2}
.sumrow .vs{font-size:13.5px;color:var(--juan);line-height:1.75}
.chain{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chain .cstep{background:var(--gan);border:1px solid var(--line);padding:8px 14px;border-radius:2px;text-align:center}
.chain .ck{font-size:11px;color:var(--mu);letter-spacing:.06em}
.chain .cv{font-family:var(--serif);font-size:26px;color:var(--jin2);line-height:1.25}
.chain .carr{font-size:12px;color:var(--shi2);letter-spacing:.04em}
@media(max-width:600px){.two{flex-direction:column;gap:4px}.two .lab{flex:none}
  .sumrow{flex-direction:column;gap:2px}.sumrow .k{flex:none}.sumrow .v{font-size:26px}}
@media(max-width:600px){.wrap{padding:0 12px 60px}h1{font-size:20px}.big{font-size:29px}
  .grid27{grid-template-columns:repeat(3,1fr)}th,td{padding:6px 5px;font-size:12.5px}}
</style>
</head>

<div class="wrap">
<header>
  <h1>宿曜 · 七政四餘</h1>
  <div class="sub">兩套古代星命系統，同一份生辰，並列不合併<br>宿曜出唐譯《宿曜經》（印度來源）· 七政四餘據《明史·曆志》（中國本土）</div>
</header>

<nav role="tablist">

  <button role="tab" id="t7" aria-selected="false" aria-controls="p7">查表</button>
  <button role="tab" id="t5" aria-selected="false" aria-controls="p5">文獻·宿曜</button>
  <button role="tab" id="t6" aria-selected="false" aria-controls="p6">文獻·七政</button>
</nav>

<div class="card">
  <h2>生辰</h2>
  <div class="row">
    <div><label for="y">年</label><input id="y" type="number" value="1990" inputmode="numeric"></div>
    <div><label for="m">月</label><input id="m" type="number" value="1" inputmode="numeric"></div>
    <div><label for="d">日</label><input id="d" type="number" value="1" inputmode="numeric"></div>
    <div><label for="hh">時</label><input id="hh" type="number" value="12" inputmode="numeric"></div>
    <div><label for="mi">分</label><input id="mi" type="number" value="0" inputmode="numeric"></div>
  </div>
  <div class="row" style="margin-top:10px">
    <div class="w"><label for="lon">東經</label><input id="lon" type="number" value="121.5" step="0.001" inputmode="decimal"></div>
    <div class="w"><label for="lat">北緯</label><input id="lat" type="number" value="25.0" step="0.001" inputmode="decimal"></div>
  </div>
  <button class="ghost" id="loc">用我目前的位置</button>
  <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px">
    <label style="margin-bottom:6px">查詢日期（日曆與行限用；預設今天）</label>
    <div class="row">
      <div><label for="dy">年</label><input id="dy" type="number" inputmode="numeric"></div>
      <div><label for="dm">月</label><input id="dm" type="number" inputmode="numeric"></div>
      <div><label for="dd">日</label><input id="dd" type="number" inputmode="numeric"></div>
      <div class="w"><label for="xmode">行限用何法</label><select id="xmode">
        <option value="both">兩法並列</option><option value="gong">甲・宮限</option><option value="dao">乙・倒限</option>
      </select></div>
    </div>
  </div>
  <div class="toggle"><input id="ts" type="checkbox" checked><label for="ts" style="margin:0">用真太陽時（依經度與均時差修正，古法標準作法）</label></div>
  <button class="go" id="go">排盤・查日期</button>
  <div class="tiny" style="margin-top:8px">緯度只有「星盤」分頁的上升點會用到；宿曜不需要緯度。</div>
</div>

<section id="p0" role="tabpanel"><div id="outIntro"></div></section>

<footer>
兩套系統的判斷文字全部照抄原書，未經改寫或挑選。宿曜的吉凶語出唐代佛經，七政四餘這一版只排盤、不斷事。<br>
本工具用於研究古代曆算與星命文獻的計算結構，不是命理諮詢。
</footer>

<script>
/* 宿曜曆經引擎 — 曆象核心
   月黃經：Meeus《Astronomical Algorithms》ch.47（六十項截斷）
   日黃經：Meeus ch.25（低精度）
   均時差：Meeus ch.28
   歲差：Lahiri 線性式，另備手動 ayanāṁśa 欄
*/
'use strict';
var XY = (function () {

  var D2R = Math.PI / 180, R2D = 180 / Math.PI;
  function sin(d) { return Math.sin(d * D2R); }
  function cos(d) { return Math.cos(d * D2R); }
  function mod(a, n) { return ((a % n) + n) % n; }
  function norm360(a) { return mod(a, 360); }

  /* ---------- 儒略日 ---------- */
  // 西曆（1582-10-15 起格里曆，之前儒略曆）→ JD（UT）
  function toJD(y, m, d, hourFrac) {
    var Y = y, M = m;
    if (M <= 2) { Y -= 1; M += 12; }
    var greg = (y > 1582) || (y === 1582 && (m > 10 || (m === 10 && d >= 15)));
    var A = Math.floor(Y / 100), B = greg ? (2 - A + Math.floor(A / 4)) : 0;
    return Math.floor(365.25 * (Y + 4716)) + Math.floor(30.6001 * (M + 1))
      + d + B - 1524.5 + (hourFrac || 0) / 24;
  }
  function fromJD(jd) {
    var z = Math.floor(jd + 0.5), f = jd + 0.5 - z, A = z;
    if (z >= 2299161) {
      var al = Math.floor((z - 1867216.25) / 36524.25);
      A = z + 1 + al - Math.floor(al / 4);
    }
    var B = A + 1524, C = Math.floor((B - 122.1) / 365.25),
      D = Math.floor(365.25 * C), E = Math.floor((B - D) / 30.6001);
    var day = B - D - Math.floor(30.6001 * E) + f;
    var mo = (E < 14) ? E - 1 : E - 13;
    var yr = (mo > 2) ? C - 4716 : C - 4715;
    var di = Math.floor(day), hf = (day - di) * 24;
    return { y: yr, m: mo, d: di, h: hf };
  }
  // ΔT（Espenak/Meeus 多項式，簡化；只需秒級即可）
  function deltaT(y) {
    var t, u;
    if (y < -500) { u = (y - 1820) / 100; return -20 + 32 * u * u; }
    if (y < 500) { u = y / 100; return 10583.6 - 1014.41 * u + 33.78311 * u * u - 5.952053 * u * u * u - 0.1798452 * Math.pow(u, 4) + 0.022174192 * Math.pow(u, 5) + 0.0090316521 * Math.pow(u, 6); }
    if (y < 1600) { u = (y - 1000) / 100; return 1574.2 - 556.01 * u + 71.23472 * u * u + 0.319781 * u * u * u - 0.8503463 * Math.pow(u, 4) - 0.005050998 * Math.pow(u, 5) + 0.0083572073 * Math.pow(u, 6); }
    if (y < 1700) { t = y - 1600; return 120 - 0.9808 * t - 0.01532 * t * t + t * t * t / 7129; }
    if (y < 1800) { t = y - 1700; return 8.83 + 0.1603 * t - 0.0059285 * t * t + 0.00013336 * t * t * t - t * t * t * t / 1174000; }
    if (y < 1860) { t = y - 1800; return 13.72 - 0.332447 * t + 0.0068612 * t * t + 0.0041116 * t * t * t - 0.00037436 * Math.pow(t, 4) + 0.0000121272 * Math.pow(t, 5) - 0.0000001699 * Math.pow(t, 6) + 0.000000000875 * Math.pow(t, 7); }
    if (y < 1900) { t = y - 1860; return 7.62 + 0.5737 * t - 0.251754 * t * t + 0.01680668 * t * t * t - 0.0004473624 * Math.pow(t, 4) + t * t * t * t * t / 233174; }
    if (y < 1920) { t = y - 1900; return -2.79 + 1.494119 * t - 0.0598939 * t * t + 0.0061966 * t * t * t - 0.000197 * Math.pow(t, 4); }
    if (y < 1941) { t = y - 1920; return 21.20 + 0.84493 * t - 0.076100 * t * t + 0.0020936 * t * t * t; }
    if (y < 1961) { t = y - 1950; return 29.07 + 0.407 * t - t * t / 233 + t * t * t / 2547; }
    if (y < 1986) { t = y - 1975; return 45.45 + 1.067 * t - t * t / 260 - t * t * t / 718; }
    if (y < 2005) { t = y - 2000; return 63.86 + 0.3345 * t - 0.060374 * t * t + 0.0017275 * t * t * t + 0.000651814 * Math.pow(t, 4) + 0.00002373599 * Math.pow(t, 5); }
    if (y < 2050) { t = y - 2000; return 62.92 + 0.32217 * t + 0.005589 * t * t; }
    if (y < 2150) { return -20 + 32 * Math.pow((y - 1820) / 100, 2) - 0.5628 * (2150 - y); }
    u = (y - 1820) / 100; return -20 + 32 * u * u;
  }

  /* ---------- 章動與黃赤交角 ---------- */
  function nutObl(T) {
    var Om = 125.04452 - 1934.136261 * T + 0.0020708 * T * T + T * T * T / 450000;
    var L = 280.4665 + 36000.7698 * T, Lp = 218.3165 + 481267.8813 * T;
    var dpsi = (-17.20 * sin(Om) - 1.32 * sin(2 * L) - 0.23 * sin(2 * Lp) + 0.21 * sin(2 * Om)) / 3600;
    var deps = (9.20 * cos(Om) + 0.57 * cos(2 * L) + 0.10 * cos(2 * Lp) - 0.09 * cos(2 * Om)) / 3600;
    var U = T / 100;
    var e0 = 23 + 26 / 60 + 21.448 / 3600
      + (-4680.93 * U - 1.55 * Math.pow(U, 2) + 1999.25 * Math.pow(U, 3) - 51.38 * Math.pow(U, 4)
        - 249.67 * Math.pow(U, 5) - 39.05 * Math.pow(U, 6) + 7.12 * Math.pow(U, 7)
        + 27.87 * Math.pow(U, 8) + 5.79 * Math.pow(U, 9) + 2.45 * Math.pow(U, 10)) / 3600;
    return { dpsi: dpsi, deps: deps, eps0: e0, eps: e0 + deps, omega: Om };
  }

  /* ---------- 太陽視黃經 ---------- */
  function sunLon(jde) {
    var T = (jde - 2451545) / 36525;
    var L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
    var M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
    var C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * sin(M)
      + (0.019993 - 0.000101 * T) * sin(2 * M)
      + 0.000289 * sin(3 * M);
    var tru = L0 + C;
    var Om = 125.04 - 1934.136 * T;
    var lam = tru - 0.00569 - 0.00478 * sin(Om);   // 視黃經（含光行差與章動）
    return norm360(lam);
  }

  /* ---------- 月亮黃經：Meeus 47.A 六十項 ---------- */
  var MT = [
    [0, 0, 1, 0, 6288774], [2, 0, -1, 0, 1274027], [2, 0, 0, 0, 658314], [0, 0, 2, 0, 213618],
    [0, 1, 0, 0, -185116], [0, 0, 0, 2, -114332], [2, 0, -2, 0, 58793], [2, -1, -1, 0, 57066],
    [2, 0, 1, 0, 53322], [2, -1, 0, 0, 45758], [0, 1, -1, 0, -40923], [1, 0, 0, 0, -34720],

    '福德': '福德主星盛者福厚弱者福淺身，居上而無福者有之有福，而居下者未之有也。福元升殿入垣救助之星明盛守照必膺，莫大之福。如福元失度退留或遭忌淩，犯則無純粹之福矣。或身為貴人，因此不享朦朧之福者有之，如人居簾幕高堂之內，因此不享安恬之。福者亦有之有星救代者，尚可言福若官福身命之主俱虧，又無救代之星不惟難言，其福又恐因此而流下矣。德者福之基也，福者人之德也，猶人心之所生。苟若不行善不積德雖有福而無福，誠使行善而修德，雖無福而有福也，故雲福德。',
    '財帛': '財帛主星升殿入垣或守本宮或明盛，當天或救助之星勢盛照臨者可言其富，若財受制被克有救代者雖退，破之余尤可與其再蓄。若財星益田主必多儲積增置，財星反克田宅者必因而破家也。財星救助官星者富益厚貴益隆，財星反犯官星者必因之而傷官祿或因之而起訟財星犯壽元，雖富足而不享天年財元退留受制無救者，其來有限所費無厭更值犯者強盛，恐無隔宿之留矣。有救代者尚可以望溫潤之象也。此專論財星財帛乃高強之宮喜，主星旺則生財矣。主星弱而受制者亦不生財矣。',
    '妻妾': '妻妾主星升殿入垣有救助之星照臨者必得貞順偕和之妻，余氣盛者有美麗之妾也。妻星益助官星者必因之而貴，反犯官星者必因之而訟。妻星援助田宅者必因之而起，家反侵田宅者無益鄰官主者，貴妻星受制退留者或被忌星，淩宮殿之上者多主刑克，彼此相敵庶可偕老。餘氣力勝代之必主再婚無力代之，或娼或妾或再醮之婦繼之也，若無救代之星終於不娶而已矣。此宮得吉星又得扶救之星，而宮主得其正垣無克犯者主夫妻如琴瑟之和，賢如孟光者。',
    '男女': '男女主星升殿入垣無干犯之曜，有救助之星多育聰明榮貴之子，若余氣明盛力勝子之主者又當育庶生之貴子也，或子星受制淩犯者盛，若有星救援尚可有之。以餘氣代之者異胞之子可也，子星留退受制無救代者，但望正室之生難矣。子星退留不及其數受制遭傷或只生女而已子息之主救助，官星者因之而榮貴救助，田財者因之而起家而至富救助福壽元者因之而益福益壽救助，身命主星者必敬順之義。凡救助諸用星者為有益之子也，若子息之主侵淩田財者因之而破家，退耗侵淩官星者因而招訟傷官侵淩身，命壽元者有悖上之患及反噬之虞，值此者不仁不義不忠不孝於此見矣。凡雙生者男女宮及主星如在雙魚雙女人馬陰陽，四宮皆含雙意必主雙生或在雙生，立命亦在此四宮也。凡問男女之數隻以水一火二木三金四土五取之，凡取只以寅申巳亥上取之。',
    '兄弟': '兄弟主升殿入垣或守本宮，無干犯之曜有救助之星者，棣萼聯芳使宮主退留失躔或遭忌，星所破則只影高飛有代之者，或異胞也有救之者，當可聚也兄弟之主益官益財益宅者，必因同氣之力而致富而致貴。若兄弟之主侵官侵財侵田宅者必因之以起爭端，或兄弟之主傷壽元者或因之而傷壽矣。兄弟之宮主星與各宮主不相克者主兄弟相和，如唐元宗與五王長枕大衾而共宿建花萼相輝之樓而共樂怡怡如也。',
    '遷移': '遷移主得度無淩又救援力盛者必膺順動之榮，或宮主受制退留遲弱行有沬趄難求，利達或身命主居遷移或遷移，遇身命主或身命被遷移驛馬照破及驛馬入遷移之，位必主平生作事進退非出祖過房必移根，換葉或為萍梗之客。凡看遷移主星近君位則主在京畿，或東或西或南或北或遠或，近隨祿馬所向之宮斷之。',
    '奴僕': '奴僕主升殿入垣有救助者必多僕從，或主星或援星守宮得為力，若主星失度退留沉溺者，雖僕不可留也。宮主傷克身命及侵犯，財官之主非但不能聽，其驅策，又恐反有疾視之虞，或因之而傷官破財致禍，若侵妻妾主者又有難言之害也。',
    '相貌': '相貌宮分居諸宮之末，以天宮論之反為諸宮之首也。宮主得度明盛有救助之星，必賦清秀之質，若宮主受制退留淩犯強盛又無救援之星者，容儀必不美也。已上十二宮星辰並皆要，吊起飛來橫衝直撞挨官，查度逐宮認論。故曰：明見不如暗見，明拱不如暗拱是也。十二宮之論皆以宮主度主而論吉，曜則吉凶，曜則凶但以生者助者為吉，救援者次之，其於克者並空的亡劫者皆凶也。'

  var STAR = {
    '田宅': { name: '田宅宮天富星', text: '金居田宅父母宮，白日生人主困窮，如逢夜裡最為吉，產業自榮邁祖宗。木臨田宅興父母，自然福壽世難同。水居第四旺田莊，更有雙親壽命長。火星臨此不堪說，土星躔入有房廊，白日生人為最吉，夜生父母早年亡，日居田宅足田園，木到雙親福壽全。火孛不照多產業，水金合會常堪憐，月臨雖稱旺田宅，白日生人反作累，紫氣居之多壯麗，父母一時居富貴。木星入位必有官，水月合兮居顯位，羅居田宅不堪猜，十般死惡反破財。計都侵之憂父母，田莊牛馬化成灰，月孛居安亦如之，夜生亦可減毫釐，晝生又忌火來克，父母早亡主孤恓。田宅土也，水有資助之力，火能害物故少利，日木土主晝生，火月金水主夜生，反之不吉。' },
    '妻妾': { name: '妻妾宮天對星', text: '金在妻宮妻妾好，木星晝會喜相逢，其妻非但能廉潔，貌白容妍世孰同。水在妻宮多妖冶，火則傷殘莫論容，夜生尤自主分離，何況生逢在日中。土入妻宮無貌娘，妻妾命如日裡霜，太陽美貌火孛醜，太陰見水美容妝。紫氣木星太陰吉，羅?自縊檢屍傷，計入妻宮勞患死，不然毒藥溺江亡。妻妾宮中見孛星，計都水火自相刑，兼主蛇傷並自吊，不然產難墮胎生。火孛瘟?死暴哀，落水懸樑產難災，木氣二星多美麗，姿容可與貴妃齊，羅計二星產難別，暴喪逃亡自帶來，氣孛水金淫欲甚，交情奴僕老心灰。金乃為男之妻，火乃為妻之夫也，且妻妾宮遇金星得其正也。' },
    '男女': { name: '男女宮天孤星', text: '金星若在男女宮，四男聰俊各英雄。火在此宮不得地，遇著來時定主窮。土臨第五遲遲有，夜生決定主孤蹤。太陽若照男女宮，必主貴子顯門風，太陰到此亦如之，三男富貴夜為功。紫氣當生照男女，不被惡星並火土，三合水月同聰俊，男女榮華定文武。羅照男女主夭亡，計都臨照亦災苦，孛星倘若居此宮，十生九死空費乳，為人性狠惡心腸此，乃依經與君語。金數四主有四子，太陽太陰本人之父母也，日生太陽吉、夜生太陰吉，反背者無力。' },
    '疾厄': { name: '疾厄宮殺難星', text: '金臨疾厄永無疾，木居富貴常安逸。水在此宮遇孛計，必定腰駝並背曲，白日生人火曜沖，必定風痰吐血終，熒惑疾厄須驚悸，土臨八位主瘟凶。太陽遇計火土孛，風勞血病不久歿，如見木月獨照之，一世優遊無消歇。此宮若見紫氣臨，定是安榮居要津，羅照此宮應篤疾，計會孛來定凶，侵非惟癆瘵又瘟?抑且吐血臥床亡。疾厄之宮惟金木，主仁義則無災厄也，木月次之，其餘計都羅?孛水之星，皆主不安，火土更甚，紫氣又能解人之厄。' },
    '官祿': { name: '官祿宮天福星', text: '太白木星入官祿，一世為官居顯軸，天上之宮會水星，太陽合照作公卿，水居好樂合於月，官居位顯職非輕。火在十宮夜入廟，朝端定列仍年少，羅星計孛本為凶，官祿之宮不可容。土星尊重多豐祿，紫氣添成衣食足，只宜興旺不宜衰，為人慷慨多榮富。官祿之宮正乃人，之壯而行之之位，宜吉星則大有為，士君子立于朝，庶人興於家，商賈發于市，苟若凶星會照，誠為一匹夫輩也。' },
    '財帛': { name: '財帛宮天寶星', text: '金臨財帛足隨時，夜裡生人皆進鎡。木臨財帛必豐隆，日中生者最難逢。水臨財帛財帛散，更被孛來不足。看火居財帛與前，同土居財帛皆豐亨。太陽居此足錢財，質庫常開待物來。月居財帛多財帛，只怕土星三合克。氣入二宮亦忌之，遇日木扶還又得。羅計孛入損資財，終身不得資財力。水性就下其形漂流而不息，主不住財，火性炎勢雖高而不耐久。' },
    '奴僕': { name: '奴僕宮僕馬星', text: '金木星居足奴僕，土若加之夜為毒，火在此宮必少力，太陰值此多悲哭，非惟辛苦有多般，決定生時非正屋。月居此位被日土，一世多迍更貧苦。第六宮中見太乙，男女頑愚多忌疾，不然遲忌亦寡微。此乃皆言多不利，計羅居此有災殃，孛若臨之號凶極。奴僕不宜高於命主星也，若高於命主則奴欺主也。' },
    '兄弟': { name: '兄弟宮天玉星', text: '木金兄弟主英雄，水星和樂旺門風，火在此宮定孤寡，夜生不與孤寡同。土臨兄弟終和睦，日居未可同言語，生時父母決相背，木計合宮主貧苦。太陰若得主星來，輔弼榮華由此，胎氣臨第三兄弟少，計星遇此漸生災。月孛來時損兄弟，古人傳說難躲避。木星主仁、金星主義、水星主智故吉。' },
    '遷移': { name: '遷移宮地驛星', text: '木金之宿入遷移，定主遷移福祿齊。水星卻主遠行吉，金木合照封侯印。土星阻滯難遠行，太陽晝生反為益。金水會月夜生奇，命度相逢喜見之。此宮見氣主為官，太陰合照為瑞端，羅在遊行必見別，家中當見檢屍靈，計都若會孛星入，決定蛇傷並虎擒。切聞月孛入遷移，損田損宅損妻兒。' },
    '福德': { name: '福德宮福壽星', text: '福德宮中或見金，夜生一世福神欽。木會太陽居十一，祿厚福優居顯秩。水會月吉火淺薄，金土同照主食邑，十一宮中羅最吉，太陽木氣三合值，生則須封萬戶侯，死則定知當廟食。廟食謂列忠，臣廟而受祭。' },
    '相貌': { name: '相貌宮', text: '土星相貌卻烏黃，木宿元來瘦且長。金白不惟多嗜欲，水星行動受趨蹌，羅?薄藝隨身有，月孛為人帶黑醜，熒惑一星多性惡，水星最是雙眉好，計都巧計愛談論，羅火東西打殺人，水火相隨多雜藝，太陽為性卻逡巡，月孛一生多嘴舌，水星伶俐木都美，土星頑鈍言語澀，羅火為人貪可鄙。十一曜一星主一相，凡人之美惡、兇狠、溫和、古怪、俊逸皆由各星形狀所稟生之初者也，非一而論之。' }

  var RU = {
    '太陽': {'子':'天宜本是太陽星，遇夜生人卻有情。若在日生光太昧，祿高到底總無成。夜生人主吉，日生人無成，', '丑':'日醜太陽居醜號天幽，此位來屬鬥牛。若是照臨官祿地，管教一世盡優遊。醜宮陰靜主人清閒之象，', '寅':'日寅日居人馬號天桑，光照東升遍萬方。祿厚福高名必顯，也應補袞坐朝堂。有日出扶桑之象，日之喜宮也。', '卯':'太陽出卯曰天烏，稟性英明大丈夫。多藝多才非俗士，一生榮顯祿盈餘。卯乃日出之門戶，主人俊偉。', '辰':'日出龍門角亢方，變名天爽最輝光。修文必定登科甲，管取聲名達廟堂。日到辰宮有光明，顯達之象。', '巳':'日臨雙女號幽微，祿厚權高勢位巍。年少功名即顯達，藍衣換取綠袍歸。日乘旺於巳故得顯達。', '午':'日到離明曰少微，此為君位眾星依。縱逢惡曜同宮分，也要還他著錦衣。午為人君日之正位，故諸星不敢犯。', '未':'太陽臨未號天輝，日月交光世所希。設若太陰無落陷，君臣慶會管樞機。未乃月之正位日到，此日月相會主吉。', '申':'天暗元來屬在申，太陽到此晦光明。若還誕晝逢斯曜，作事須教百不成。申屬陰日已西沉。', '酉':'陽到金牛號九空，夜生雖夭卻亨通。日生用事俱無力，若變刑囚不善終。酉為金牛，日到此無光，作事不成。', '戌':'日臨戌位曰天樞，此地元來是旺居。更得太陰相會照，一生榮貴福盈餘。日入廟旺之地主榮貴。', '亥':'太陽光照爍天門，玉璽為名象屬君。倘若化為官祿曜，少年平步立功勳。亥為天門日朝天矣，主人聰明英傑。'},
    '太陰': {'子':'月居子上號天姬，女貴男榮百事宜。若是夜生深有慶，日生還恐福傾危。月在子宮化為天姬，星夜生人主貴。', '丑':'太陰居醜曰天機，掛影扶疏耀素輝。巳癸出人如得此，官高祿厚更榮閭。天機星主人榮貴。', '寅':'太陰寅上名天昧，白日生人光太晦。在望如逢計火侵，為人穢濁還多退。天昧星主人有禍害。', '卯':'月臨卯上號天琮，與日相逢最吉通。嫌怕計都同此地，夜生反吉變為凶。天琮星主吉卯為月之喜宮。', '辰':'太陰辰位曰天璿，金若同宮瑞自然。更得孛星相會照，為官為福又長年。天璿星主官顯。', '巳':'數當陽極漸陰生，玉鹿天星月化成。珠玉不特多蓄積，更兼官顯有聲名。玉鹿星主顯達。', '午':'離宮逢月號天衣，此位朝居倍有輝。設若太陽同此位，身榮衣錦故鄉歸。太陽太陰同此，宮主享福。', '未':'太陰在未號天圭，千載欣逢明聖時。月孛更來同會照，蟾宮折取最高枝。未乃月之樂宮，化天圭主大貴。', '申':'太陰晉分曰天潢，與水同居福祿昌。縱有孛星相照破，也須榮貴富而康。月化天潢主大富貴。', '酉':'天柱之星屬太陰，喜居酉位福原深。夜生管取多祥泰，一世優遊禍不侵。酉乃月之乘旺，化天柱星主人富厚。', '戌':'月臨戌上名天輔，喜到奎婁為妙度。玉兔揚輝倍有情，禹門快躍朝天步。戌乃月入廟又化天輔星，主大貴。', '亥':'天？變化太陰星，散彩中宵分外明。吉宿同宮宜貴顯，少年及第播清名。月到亥宮化為天？星，主少年科第大顯。'},
    '歲星': {'子':'地劫為名最不情，木星到此打齊瓶。化為吉曜猶無害，若變凶星不得生。木到子宮謂之木打寶瓶。', '丑':'木德之星拱北斗，名為天蔭最優遊。功名年少須成就，利祿何須用力求。鬥木獬升殿。', '寅':'木星寅位曰天淵，偏愛逢生樂自然。甲丙生人如值此，盡教福祿慶雙全。寅乃木之祿位。', '卯':'木入幽州號太微，背中反旺卻為奇。最防變作刑囚曜，命若逢之大不宜。卯乃乘旺之宮。', '辰':'木到辰宮號玉龍，與金同位最亨通。丙幹之命如逢此，名顯官高祿更豐。木金辰宮謂之金木逢龍。', '巳':'木居巳上名天福，與水相逢須富足。丙庚之人如遇此，文章年少觀場屋。木化天福星、主富貴。', '午':'歲星午上號天德，一世優遊無否塞。更得太陽相會行，家財倍萬珍珠積。天德星主清閒。', '未':'木入秦州號玉班，一生享福更平安。壽高福厚多榮貴，決入朝中作顯官。木化玉班星、主入朝班之貴。', '申':'木居申上號天鸞，莫作尋常俗命看。男子逢之應紫綬，女人遇此帶金冠。天鸞星主人功名富貴。', '酉':'木居酉上號天囚，徒配刑流出遠州。若遇火星同到此，少年暴卒命難留。酉宮屬金木被傷。', '戌':'木為鼓舞少年孤，男克妻兮女克夫。廣覽詩書並藝術，飄蓬四海作生圖。化此星主克陷。', '亥':'木臨亥上號中台，滿腹當為翰苑才。若是為官並福曜，少年登第作元魁。亥乃木之長生廟樂旺之地。'},
    '熒惑': {'子':'天坎之星到寶瓶，元來是火化為名。萬般施計皆沉滯，多難多災大不情。子宮火化為天坎星，極主遲滯。', '丑':'火星牛鬥名黃道，為福為祥誠是好。那更土星相會行，夫妻保守期偕老。醜宮火化為黃道。', '寅':'火寅；火居人馬號天升，起處逢生福倍增。更得木星同會此，多才多藝又多能。寅為人馬火化天升星。', '卯':'火到卯宮名天乙，貨財充足庫箱實。若還滿用入垣宮，年少成名登桂籍。如一星有三用謂之滿用。', '辰':'天滯居辰是火星，一生用事百無成。若還金宿來相會，不夭須當犯國刑。火化天滯星，主作事不成。', '巳':'火居雙女曰天刑，與水同行最不甯。若變刑囚千裡外，不然一世苦伶仃。巳宮屬水，故火受克，主人奔蕩。', '午':'火居午位名天赫，此位朝君無戰克。不為利祿自充盈，必定為官居顯職。午為君位，火朝君化天赫，主人豐顯。', '未':'天廢火星居巨蟹，只愁夭喪深為害。不然多難又多災，縱有資財多破壞。此宮主破財災害。', '申':'火到申宮曰喜神，中年未免事無成。須教末主方寧貼，到老應知福壽身。申乃火之喜宮，故曰喜神。', '酉':'火在酉宮名黑道，縱雲夜誕非為好。惡星不照吉星臨，方可榮華並壽考。酉宮火不得地。', '戌':'天軌火星守白羊，一生享福吉非常。財豐祿厚無虛耗，中主榮華晚更昌。戌為白羊火化天軌星，乃火之本宮。', '亥':'火居亥上是吉星，天纛知為變曜名。不論官宮並晝夜，也須備福主豐亨。火到此宮主人豐富，緣木有相生之理。'},
    '鎮星': {'子':'土居齊分號天元，壽筭綿長福祿全。第七宮中如值此，榮妻益子福綿綿。子宮土之樂。', '丑':'土到醜宮名印綬，珍珠財寶多般有。此宮廟旺最為佳，縱是夜生為福壽。土之本位得為滿、用豈不福。', '寅':'土入寅宮曰貴人，此宮不喜木相親。只愁變作刑囚耗，晚主多災更滯迍。化為貴人，星主先貧後富。', '卯':'土居卯位號天沖，與火相逢亦慶隆。只恐六壬人值此，遭刑受害命須終。沖者湧搖之象。', '辰':'土曜居辰名太極，喜在亢宮依鄭國。此為入廟最榮華，日誕夜生俱有益。辰乃土之樂旺、主榮華。', '巳':'土居雙女非為吉，本主逢之怎奈何。更逢吉宿也多災，若不遭刑須夭折。巳宮化天魔星，主人夭折。', '午':'天道元來是土星，太陰會此倍精神。縱雲夜誕仍為福，日裡生人大貴榮。化天道星主喜。', '未':'土入未宮名四鎮，福多祿厚家豐盛。太陰若也與同行，不是望宵終有慶。', '申':'申宮土號福生星，本主同鄉祿自成。更有官星相會聚，名彰聲顯貴還榮。申乃長生之位。', '酉':'土居酉位號天沐，雖是敗宮須享福。不宜火曜共同行，少年不享人間祿。土敗于酉故雲壽短。', '戌':'土居戌位號天關，一世優遊得自閑。只恐水星相會遇，終身不免受艱難。', '亥':'黑符亥上不為榮，實號俱無只有名。不是外居並外發，也須先敗後方成。主先凶後吉。'},
    '太白': {'子':'太白之星到寶瓶，名為玉輅福非輕。丙丁之命如逢此，不特長生更富英。玉輅星主人富厚，輅者殷之車名。', '丑':'金來醜上名天庫，多玉多金難計數。少年銳志在功名，聲譽播揚人所慕。天庫星主福、醜乃金之庫。', '寅':'金星人馬號毛頭，破蕩家財往外州。須是強宮多吉宿，方能救助不為憂。寅宮金不得地。', '卯':'金星卯上名天敗，起處逢傷人不奈。年少應須克六親，奔波漂蕩多災害。金至此主克陷。', '辰':'金到辰宮曰太常，庶人見此始為良。少年科甲名天下，品秩榮遷輔聖王。辰乃金之廟旺。', '巳':'巳金天祿本長生，變曜名為天祿星。與水同宮最奇特，官高祿厚佐王庭。金會蛇則喜。', '午':'金星變曜曰天暘，入到離宮大吉祥。為子孝廉臣盡節，直須簪冕佐君王。金星乘旺。', '未':'金居巨蟹曰天倉，與水同宮福祿昌。若是丙丁人值此，多高位顯壽延長。天倉者貯積之星，主富貴。', '申':'太白臨申號玉堂，庚辛人見旺金鄉。若無羅火同居此，須信生平福熾昌。', '酉':'金居酉位名天印，管取生來常吉慶。火宿若還相會時，刑囚破碎多災病。怕火同宮。', '戌':'魯分金名天吊星，不宜火宿與相鄰。縱然不夭終非美，繈褓須當克六親。主夭害。', '亥':'金臨亥位號天壽，但管一生長富有。天算綿延無絕期，怕逢熒惑反為咎。亥宮金星乘旺。'},
    '辰星': {'丑':'水居醜位號晨門，朝鬥分明主勢尊。若不變為刑暗耗，少年及第六殊勳。', '寅':'水臨寅上名天懿，管取一生無阻滯。設若木星會合時，不惟利祿名兼遂。', '卯':'水流卯地名困苦，只怕此星傷本主。奔波役役受艱辛，纔得清閒漂蕩去。水至卯而傷。', '辰':'辰宮得水號琴堂，太白同行福倍昌。人命逢之多吉泰，少年顯達把名揚。', '巳':'水來巳上號榮名，樂廟之宮萬事亨。若得金星同會此，黑頭早著翰林聲。金水會蛇。', '午':'水臨獅子曰天溫，與日同行倍有文。設若變為官祿主，名高位顯眾人尊。水陽相會。', '未':'未逢水曜名天乙，與月同宮方入格。縱然惡曜相會行，也須顯達榮家宅。', '申':'水居申位名榮顯，此是本垣無否塞。庚與壬人若見之，修文方中青錢遲。此為長生之位。', '酉':'絕祿元來是水星，嫌居酉位不安寧。生來用事多迍滯，縱有家財也替淩。此為敗地。', '戌':'水在白羊號伏屍，一生迍滯主災危。雖逢吉曜相扶助，便得成名且亦遲。落胎刑相不完。', '亥':'亥宮天綬水之精，掌握兵機挫虜人。官祿遷移身命值，何愁方外不揚名。此為得祿之地主貴。'},
    '紫氣': {'子':'紫氣齊瓶號玉清，只宜恬淡養精神。命宮遇者傷妻子，散誕清閒僧道人。氣在子宮化為玉清星，主修道清高。', '丑':'氣星在醜曰天元，生世無災福慶全。更得吉星相會照，前遮後擁是神仙。醜宮化為天元星主吉。', '寅':'氣居寅上名天飭，獨享清閒人不識。容貌端嚴冠眾倫，落紙煙雲揮彩筆。化天飭星主有文章。', '卯':'氣星在卯號天空，克害妻兒年少終。不是僧尼井藝術，一生孤獨更飄蓬。化為天空主，孤獨無積。', '辰':'華蓋從知氣在辰，此星雖獨卻堪親。優遊享用無災咎，啖柏餐松物外人。化華蓋主清廟。', '巳':'氣居雙女號天相，家積珠珍主富藏。福厚清閒井壽永，只愁妻子見刑傷。主富而刑妻。', '午':'紫氣臨周號玉肌，人生逢此誠為美。太陽設若同宮分，富貴榮華世無比。化玉肌主子孫榮貴。', '未':'氣居未位名天廩，潤色文章鋪秀錦。更得主星在高強，家多珍玉豐腴甚。化天廩主富足。', '申':'氣入申宮曰紫微，此宮廟旺最為奇。一生獨享清閒福，作事臨危又不危。化紫微清高受福。', '酉':'紫氣金牛號鳳凰，一生享福最安康。文章錦繡聞天下，若占高強入廟堂。酉為金牛，化鳳凰主富貴。', '戌':'氣在白羊名玉貫，空房獨守誰為伴。同宮最怕火羅侵，破敗家財心緒亂。戌為白羊化玉貫，忌火羅。', '亥':'亥宮紫氣名天貴，稟性清閒無所累。木土那堪會舍行，少年顯達功名遂。化為天貴主享福。'},
    '月孛': {'子':'孛星在子名天酷，稟性凶頑還有福。遇者妻兒有克傷，權謀機變般般足。孛在子宮化為天酷星。', '丑':'孛居醜位，曰天柔，欽任雍容拱鬥牛。化作刑囚終禍害，若為福祿備加休。孛在醜化為天柔。', '寅':'孛臨人馬，名天后，癸乙生人多主壽。若為官祿富文才，一舉登科金印綬。孛在寅化為天后。', '卯':'孛星變曜玉垣星，卯位朝君福非輕。那更化為官祿曜，少年金榜定標名。孛在卯化為玉垣星。', '辰':'辰宮月孛，名天慘，太白同宮應福減。若遇水星相逐行，生來必主多刑陷。化為天慘星。', '巳':'孛居巳上號孤鸞，男女逢之必寡鰥。忌曜若臨須減力，吉星來照也艱難。化為孤鸞星。', '午':'孛星臨午，名玉氣，此地朝君長富貴。變為祿貴與官魁，名顯身彰應品位。化為玉氣星。', '未':'孛入秦州，名太乙，穩步蟾宮名第一。一生榮顯少災迍，俊邁聰明超眾職。在未化為太乙星。', '申':'孛星申位，名天毒，稟性頑愚常碌碌。戀酒迷花無了期，也教賣盡黃金屋。在申化為天毒星。', '酉':'孛到酉宮，名活曜，不常喜怒性情拗。太陰到此與同行，災禍消兮居顯要。在酉化為天曜星。', '戌':'孛星到戌，名死氣，至老孤貧苦未休。身命七強如落陷，牽連官事作冤仇。到戌化為死氣星。', '亥':'孛星臨亥，曰天聰，此位朝天入帝宮。雖有災殃終不害，若為官祿亦亨通。孛在亥化為天聰星。'},
    '羅喉': {'子':'羅?子上名天暴，稟性剛強心太躁。同舍如還見木星，德及邊方弭賊盜。性急而心躁，邊鄙以施能。', '丑':'赤道之星本是羅，此星居醜竟如何。若為官祿無凶宿，官職高兮祿亦多。威而有仁、品級高遷。', '寅':'羅居寅上號天威，掌握兵戎擁帝畿。光耀朝廷羌虜服，功成齊奏凱歌歸。領百萬之兵、為北門鎖鑰。', '卯':'羅星在卯號天權，雄鎮邊陲勢獨專。入廟奇星威望重，坐令羌虜翕然安。', '辰':'羅入辰宮名八敗，火金會舍多災怪。傷妻克子陷雙親，不夭也須刑與害。', '巳':'巳上羅?為地隔，八煞宮中成水厄。雖然吉曜與同流，性格輕盈招盜賊。', '午':'午上龍宮羅可羨，名至朝參登玉殿。馳名方面掌藩垣，威鎮四夷能制亂。', '未':'羅?在未名天厄，與月同宮為病賊。最喜木星相會行，家中金玉多財帛。', '申':'羅入申宮為伏斷，獨守空房無侶伴。會照如逢月孛星，耽迷酒色心情亂。', '酉':'羅居酉位號天文，掌握兵機立大勳。甲癸生人逢此曜，文章顯赫佐明君。', '戌':'戌宮天衛是羅喉，骨肉多傷大可愁。設若同宮逢水宿，少年必定主刑流。', '亥':'羅居亥上號文昌，年少多才特異常。天首元來居帝闕，官尊爵大令名彰。'},
    '計都': {'子':'計都入子號天凶，性毒情貪又且窮。惟有己壬人遇此，又還為福主亨通。在子化天凶。', '丑':'醜上計都名四喜，身居牛鬥威權起。只愁妻子見刑傷，若是為官在朝裡。在醜化四喜星。', '寅':'計都寅上號天淵，反禍為祥吉慶全。壬巳生人若逢此，生來享福更延年。在寅化天淵。', '卯':'計在氐房名玉柄，人逢此宿多祥慶。雖然值殺及刑囚，但管一生常富盛。在卯化玉柄。', '辰':'計入辰宮名暴敗，為人兇狠多憎害。若還享福得清閒，只恐天年終不奈。在辰化暴敗。', '巳':'計都在巳名天水，雖曰為凶亦為瑞。便為惡宿相會行，也須顯達身榮貴。在巳化天水。', '午':'計都臨午曰天巋，此是朝元遇者希。若得太陽同會照，白衣換取綠衣歸。在午化天巋。', '未':'四鬼由來屬計都，只嫌未位不相符。太陰在位同居此，不夭終須主配徒。在未化五鬼。', '申':'計居申位名天賊，與水同居多否塞。不夭終須一世貧，伶仃飄蕩成孤克。在申化天賊。', '酉':'酉宮計化為天悴，惟有丁壬災自退。金命當之須少亡，不然克陷身難避。在酉化天悴。', '戌':'計都戌上名天窘，破蕩資財不自量。壬己生人為祿厚，只愁妻子早年亡。在戌化天窘。', '亥':'幹宮居計名天武，此位朝天無疾苦。縱死為刑及耗囚，也須官職膺封土。在亥化天武。'}
  };
  function get(yao, zhi) { return (RU[yao] || {})[zhi] || null; }
  function count() { var n = 0; for (var y in RU) n += Object.keys(RU[y]).length; return n; }
  return { RU: RU, get: get, count: count };
})();

/* 十一曜照宮·琅玕經（依十二宮位）與歌斷·源髓歌（通論） —— 據《張果星宗》正文
   照宮 131 條（滿 132，鎮星缺一，原書即缺）；歌斷 11 篇。照錄原文。 */
'use strict';
var ZY2 = (function () {
  var ZHAO = {
    '太陽': {'命宮':'太陽臨命照，情重性能和，衣祿堅長久，災疾自消磨，西沉無大福，東出福尤多，壽永臨中末，初年勞碌過。又曰：太陽原是火之精，躔度偏宜金水星。若在命宮官祿上，一生天下有才名。此以太陽在命宮，主人通達性剛健。', '財帛':'日居財帛要陽宮，晝生為福夜為凶。只憂計孛來相克，財帛尤閑壽不中。', '兄弟':'弟兄有若鴈同行，豈使三宮陷太陽。雖是同胞如手足，分張各自置田莊。', '田宅':'田宅宮中有太陽，須知安位最高強。膏腴萬頃連阡陌，榮祖榮宗福祿昌。', '男女':'太陽獨行子難當，破損頭男兒受殃。若有吉星來輔佐，二男異日貴非常。太陽此宮主孤克無子，吉星相扶子貴。', '奴僕':'奴僕之宮號陷方，照臨君父豈為良。縱饒父體常清健，亦恐身年壽早傷。奴僕弱陷之宮，太陽不宜居之。', '妻妾':'太陽臨照在妻宮，在望尊嚴德貴崇。莫使忌星興悖逆，婚姻皇族也平中。相生和睦相克反目。', '疾厄':'太陽來到八宮停，身體康榮福自生。設使忌星多犯克，反傷眼目不光明。日為天之目犯克則傷目。', '遷移':'第九宮中遇太陽，更無凶曜在其傍。好將平日胸中學，對策天庭謁帝王。若有天馬貴人極好。', '官福':'太陽若在十宮居，抱負宏才仰大儒。或有水金相輔佐，官高職重掌機樞。官福乃高強之位，有吉星助之大貴。', '福德':'太陽臨福遇吉星，更添命主必官清。若有吉星來輔衛，必然享福壽遐齡。福德主星相生有好星夾輔主福。', '相貌':'相貌宮中名惡弱，吉星拱臨合虛著。惟怕羅?月孛星，喜與太陽相倚約。《太陰演算法月篇】置積日減二算以三千二百二十四，一之為順行減積日，行餘不滿順行數者以九因之，以中數二百四十八數除之，除不盡者為殘，分在一百二十四已下，入疾曆二百二十四以上入遲曆。疾行：一日行十四度半強。平行：一日行十三度半強。遲行：一日行十二度半強。二十七日有奇行，一周天更行，二日與日合朔。'},
    '太陰': {'命宮':'月照人無俗孤，多自有成掌財宜，市賈托貴有權名，性急招言妒妻良。贅可膺若能員，夜照財祿自興榮。又曰：照命分明有太陰，生來財祿不勞尋。凶神若也來相犯，到老無成枉用心。太陰喜獨行則吉，凶神相犯，變吉為凶。', '財帛':'月居財帛福為深，更加廟旺足珠金。食神若也相兼照，縱有家貲禍更侵。食神食月之神月，遇之則食。', '兄弟':'兄弟親疏如手足，若值太陰大為福。只恐女多並異胞，南北分居難並屋。太陰女主之象以多女論。', '田宅':'太陰田宅若相逢，自立榮華萬事通。陰貴又增招滿益，遷移三處振家風。田宅宮無凶星相犯主吉。', '男女':'陰偶臨宮識者稀，女先男後始為奇。不惟英俊無刑克，更見高高折桂枝。月乃為人之母故吉。', '奴僕':'六位名為奴僕宮，為官須有吉星逢。月守是宮先克父，晝生夜照母先凶。夜生人吉晝生人反此。', '妻妾':'太陰西沒最為佳，明靜之宮無點瑕。更若尊星相對望，必生貴子佐皇家。主妻美麗清潔。', '疾厄':'太陰臨照八宮存，畢世災危杳不聞。忌曜莫教同此位，雙眸渾似月遮雲。日月為天眼，月在疾厄以目論。', '遷移':'太陰得在九宮中，三合加臨照命同。偏利遷移商賈客，必因陰貴得財豐。', '官福':'太陰官祿作身宮，朗朗光華福倍隆。更在廟方功愈重，貴因皇戚得侯封。要在廟旺之宮方有此貴。', '福德':'陰耦來臨福德宮，雍容道德貴尊崇。更有吉星來本位，為官須坐玉堂中。吉星同度主有大福。', '相貌':'相貌宮中有太陰，命中吉曜喜相侵。忽然忌曜來相犯，甘旨空持養母心。有吉星主吉，有兇殺則凶。'},
    '歲星': {'命宮':'木照人聰敏，藝術及文才，利官俱有益，看遇至恩該，行事人難損，逢危自脫災，聲名終有遇，衣祿晚年來。又曰：木星入命最為奇，間世文章眾所知，三主官星俱不背，他時身到鳳凰池。木乃慈惠仁德，命宮逢之必貴。', '財帛':'木星好廟更臨財，一世榮華少有災。更得善星居上下，雖然運蹇福還來。若與財帛主相生，主大富更招外財。', '兄弟':'兄弟宮中木照時，吉星遇著甚相宜。假饒鴈序恩情斷，只恐中間惡曜隨。有吉星和順凶星主分散。', '田宅':'木星得入四宮中，可見無災喜慶重。田宅昌榮須守祖，不逢破敗福豐隆。逢破敗劫殺減半。', '男女':'木星子位主三人，吉宿同宮產俊英。凶曜若來相克陷，恐憂初子損其身。若木為男女，主忌金煞相逢。', '奴僕':'第六宮中如見木，決主一生無寸祿。只因吉曜在閑宮，總有衣食妻無福。吉星不宜在奴宮。', '妻妾':'第七宮中木宿游，聰明典雅備祥休。更饒娶得高賢婦，偕老同心到白頭。木主仁故主妻賢。', '疾厄':'木星解散照其宮，且免平生患難凶。財祿更招多潤澤，堂堂人品賽終童。', '遷移':'木星得地九宮存，三方傍照命宮門。更得高高明健處，榮遷真得貴人尊。旺相之地主如是也。', '官福':'第十宮中見木星，平生衣祿享生成。文章華麗人皆仰，甲第高登位九卿。官祿高強之宮，主有大文手段。', '福德':'木星一曜最尊崇，下照當生福德宮。經史優遊多博學，不勞跬步至三公。木星居諸星之首，主清秀多文。', '相貌':'木宿如臨相貌宮，清奇古怪好相逢。聞詩聞禮多賢雅，不作郎官作相公。主人身長秀麗。'},
    '熒惑': {'命宮':'火照命宮中心明，氣量洪倚公成，附勢煩劇立身躬，財利初年散，成家未及終，若能行順旺，權重祿財豐。火在命宮，主人躁急，限到。又曰：身命宮中遇火星，此人躁急性聰明，平生喜怒真難測，凡事須教立便成。', '財帛':'火居財帛旺初年，中主交時恐不堅。若得善星同到此，末年退後又團圓。有吉扶限平穩。', '兄弟':'火臨兄弟事如何，爭競紛紛惹禍多。親戚有恩還反目，自然手足不相和。主兄弟兇狠。', '田宅':'火宿加臨第四宮，祖基破盡受貧窮。若是廟方當發福，不然孤苦一生中。主不受祖業火性炎上之勢、久成灰燼。', '男女':'火若來臨第五宮，此星刑克最為凶。假饒嗣主居廟旺，必產奇男一二龍。火在男女宮，火數二、主生二子。', '奴僕':'六位如逢火宿來，害刑牛馬定多災。屯殃變異起奴僕，得地專權自劇裁。主奴僕性高，則有欺主之故。', '妻妾':'火入妻宮定克妻，高強非忌作珍奇。女人以火為夫位，禍福同源一例推。男以金為妻，女以火為夫。', '疾厄':'火星八位憂血難，災來非命禍難禁。腰駝背曲缺唇齒，惡殺不臨厄減輕。若無煞星同宮，其禍略可。', '遷移':'火星照位入遷移，遷變東西土產移。家舍亦須防火厄，末年有屋可安居。主不安，謂火旺動搖。', '官福':'火官祿；火星兇焰入官宮，仕列銓曹少始終。若是變為官祿主，會看附鳳與扳龍。官祿為強宮，故火附其勢。', '福德':'熒惑來臨福德宮，夜生廟旺福豐隆。若值晝生逢水克，定須破敗受貧窮。火夜則明，惟夜生人主福。', '相貌':'火居相貌性剛強，惹禍興災果異常。若得吉神為救助，逢人禮貌把名彰。主人形上尖下闊，以禮待人。'},
    '鎮星': {'命宮':'土照人命孤，憂勞又有餘，初年多碌碌，祖業有如無，附依終為有，成家晚不虛，如其為祿主，晝遇貴豪居。又曰：土星居命主心癡，若有文章發更遲。更會木星井水宿，此生衣食欠精微。土在命宮主人肥大敦厚而重實，背隆而腰厚必有信義，遇克主瘦弱面色矮黃。', '財帛':'土星財帛最堪嘉，水曜同臨反破家。身命吉星須細筭，陽宮日月問榮華。水能化土為泥，故有破家之說。', '兄弟':'土臨兄弟五人同，得他之力禍重重。恐招異姓為兄弟，四海相逢也是空。土之數五，在兄弟宮，故主五人。', '田宅':'土星尊位為陽德，高占強宮為福澤。或在當生四殺中，起禍，生災豈能滅。土正為田宅之用故吉。', '男女':'土星五位在陽宮，五個男兒盡送終。孛氣忽來相犯著，男孫疾患半成空。十奴僕：奴僕宮中見土星，萬般謀運一無成。不如釋道歸林教，高臥雲中有大名。', '妻妾':'土宿夜生不可逢，加臨切忌七宮中。坎宮此地居明健，壽考雍容福不窮。', '疾厄':'土德來臨疾厄時，凶星焰焰定災危。多因聾啞雙睛翳，不是駝腰必病脾。土主脾胃，故病生於脾。', '遷移':'土德當生在九宮，命星合照莫相逢。男人漂蕩他鄉里，女子淫奔外姓中。', '官福':'土星官祿占高強，兇惡威嚴不可當。若在廟方為祿主，桓圭端冕侍君王。官祿高強之位，土喜居之。', '福德':'土星福德照臨時，若處生方始見奇。沙漠揚威名國輔，英聲傳播鎮華夷。主福厚。', '相貌':'土星凶熾不堪聞，限弱身衰主禍迍。不是年來羅蓋網，須愁狂疾不完身。'},
    '太白': {'命宮':'金主人多義，心明志自豪，倚公成附勢，權用自能高，妻娶如無贅，男兒晚歲牢，初年多偃蹇，成敗屢經遭。又曰：金星吉曜最為佳，華麗文章世所誇。莫使當年凶忌犯，婚姻貴族福無涯。為人清秀平正，遇土則肥，逢克破相。', '財帛':'金居財帛喜為深，女祿多招眾所欽。火孛只憂來克犯，中年惟恐早灰心。金居財帛人之所喜也。', '兄弟':'第三宮內見金星，義斷分金手足情。雖是鴈行同氣者，反成背面不相親。', '田宅':'金星吉曜成奇局，田宅逢之主厚福。上下加臨不見刑，一世安榮自豐足。田宅之宮金為極富。', '男女':'金星第五別為奇，子息當推有四兒。莫使同宮逢火克，榮宗耀祖不須疑。金數四主有四子。', '奴僕':'金星奴僕限宮時，年少還須克少妻。又主交朋與親戚，直饒面是背成非。金主義故曰交朋。', '妻妾':'金星本是號妻星，要在高強廟旺行。夫婦共榮多福兆，若逢火克又遭刑。男以金為妻，正得其宜。', '疾厄':'疾厄金臨本是良，英雄氣概少災殃。若教火孛來交會，骨折根傷不可當。忌刑克惡殺臨。', '遷移':'金星得地照遷移，調任榮遷福自宜。若更命無凶曜照，仰觀平地上雲梯。遷移是金，主遷西方。', '官福':'官祿宮中太白星，照臨方地產豪英。若為祿主居強位，文武雙全佐聖明。官祿高強之宮，故有此兆。', '福德':'金居福德最稱奇，德照高門長貴兒。冠世英雄攄錦繡，禹門一躍過天池。金神無殺相犯大吉。', '相貌':'金星相貌並西鄰，一部髭須胡口入。若遇貴人相接引，定為胥吏處公庭。主人白色'},
    '辰星': {'命宮':'命見水星臨，文術多智能，外財應有遇，引薦人相承，廟旺遷官職，余宮道合僧，相貌同豪貴，資財晚歲興。又曰：水德星辰在命宮，得逢旺處便攀龍。聰明智識多機變，生在榮華富貴中。水主智動而能變、主人清俊。', '財帛':'水星乘旺莫臨財，進退難逃反起災。手藝一生方可用，凡人財散亦難來。水能進退之物故忌之。', '兄弟':'水星吉曜遇還稀，來臨三宮便不宜。上有親兄下有弟，兩頭無義便侵欺。水性無定決之東則東流、決之西則西流。', '田宅':'善星一曜是辰星，得入強宮福轉精。不見當年刑忌照，便須萬頃與千籯。', '男女':'水星高照子孫位，俊邁文章為國瑞。水數推來隻一男，振起家風日榮貴。水主子少土克之則無。', '奴僕':'辰星莫入六宮中，冠世文章用處空。縱使南宮高甲過，棲遲薄祿走西東。水性主流。', '妻妾':'水到妻宮對照命，富貴貞賢人難並。忽然惡殺又相侵，心濫情淫性無定。水主清潔多智。', '疾厄':'第八宮中水德臨，溫柔情性足人欽。忌星凶曜來侵犯，沉溺波濤墜井深。主腎疾。', '遷移':'水星合照最為珍，更看當生命位星。賓主和同無惡犯，遷移出處總歡寧。', '官福':'水星偏喜照官宮，出類超群福自隆。委任股肱扶寶祚，官居高品貴尊崇。主為官清白。', '福德':'十一宮中水德來，汪洋智識仰賢才。公嚴德厚人欽重，澤被生民遍九垓。福德人之所仰，有吉星多福。', '相貌':'水星相貌最為強，凜凜清風在廟廊。若遇吉星無惡曜，容顏端正動君王。張果星宗十三'},
    '紫氣': {'命宮':'氣星臨命照遊藝最相宜，任重防傾阻名高財業微，初年多費力聚散六親離，最好中年後興榮向老時。又曰：紫氣臨宮學冠倫如為忌，曜號孤神雖然不是天庭客，也作禪門第一人。紫氣主孤雖貴而無子，逢空主為僧道。', '財帛':'紫氣木星雖吉曜，第二宮中不為。妙克己待人是此，星宮主強時財可彀。主財虛耗散，專為別人求。', '兄弟':'紫氣來臨兄弟時，孤星卻主兩分離。雖然暫且同相聚，反目無情各所之。無則自立，有則各分離。', '田宅':'當生紫氣四宮行，福蔭雙親保壽齡。看取耆年精力健，都緣強位老人星。田園樂逸黃耇無疆。', '男女':'氣星來照子孫宮，穎悟聰明更美容。邁祖超宗榮貴顯，家門昌盛福無窮。秋水精神兒女貌，冰清玉潔子孫容。', '奴僕':'僕宮紫氣兩同行，落陷孤高總欠情。奴僕成行難保住，自家炊爨自家親。獨行獨坐無人伴，自炊自煮乏親臨。', '妻妾':'七宮妻妾氣相逢，必主當年有克凶。若在命中及官祿，方袍員頂或孤從。玉笙金磬長相守，紙帳梅花獨自眠。', '疾厄':'解災脫難最高強，紫氣生平免禍殃。道德日彰君子泰，超群發秀壽延長。添君子之志，解小人之災。', '遷移':'第九宮中有壽星，堂堂眉宇美精神。豈知天上清高秀，下照塵寰有道人。在天上神仙之府，主人間道德之人。', '官福':'紫衣師道九流人，官祿宮中紫氣辰。若是孤高兄弟散，任他清貴作高真。受天帝之玉牒，作紫府之元君。', '福德':'俊雅超群紫氣星，來居福德福頻頻。必然顯達應三主，若是為官在大臣。立鴛鷺之班，居鳳凰之池。', '相貌':'相貌宮中紫氣臨，精神瀟灑福原深。如何晚景身康健，壽宿當年在此任。福如東海之深，壽比南山之盛。'},
    '月孛': {'命宮':'月孛照人命，初年災破頻，機術心自有，權謀術數精，早年防反復，中歲立方成，夜生陰位照，財祿有聲名。夜生人遇之主吉。又曰：月孛須知是惡星，逢之禍患卒難行。若還入廟宮中者，必定前程有大成。與太陰同宮主貴。', '財帛':'孛照財宮真可畏，須防人賴暗為災。限逢惡曜君須忌，吉宿臨宮主橫財。在此宮主失財耗散。', '兄弟':'兄弟不宜見孛星，大小無分手足情。若有三人三路去，四人亦作四方行。主不和。', '田宅':'第四宮中月孛臨，定遭疫癘氣相侵。憂煎失業田莊盡，到老倉箱乏寸金。主虛乏耗散。', '男女':'子孫宮裡孛星攻，狀類根甘蔕苦同。假似門庭當旺盛，也須不肖辱先宗。主兒女不肖。', '奴僕':'奴僕惟推最弱宮，孛星照臨愈為凶。當生祿主如全陷，衣食奔波守困窮。主走失不吉。', '妻妾':'望門克婦婦家貧，月孛如何更絕情。亥戌醜申未酉位，夫妻和順定無因。主妻無義。', '疾厄':'疾厄宮中月孛來，少年伏劍染非災。喜事不聞年歲久，近來常聽哭聲哀。主多疾連延。', '遷移':'孛到遷移為惡宿，口舌陰謀被辱淩。迍厄敗家他處死，路橫屍首不能興。主妒害破敗。', '官福':'月孛光芒號彗星，眾星一見斂威名。廟方若作天元主，貴擁貔貅百萬兵。主有權柄。', '福德':'福德宮中要好星，如何孛照有和平。光威自覺年來減，困頓須知目下生。無益于人有損於己。', '相貌':'十二宮中有孛星，形容麤醜俱知聞。性情不定如狂妄，舉止無憑似少神。張果星宗六本篇目錄：張果星宗十五羅喉演算法羅星篇、羅喉總論、羅喉歌斷、羅喉入宮、羅喉躔宿、羅喉照宮、計都演算法計星篇、計都總論、計都歌斷、計都入宮、計都躔宿、計都照宮、星辰妙度歌、喜宮歌、入廟、乘旺、樂宮、喜宮、殿垣、度數、合格、忌躔歌。張果星宗十六洞微百六限說、限步之說、洞微中五百六相乘數、限度主論、行度假如、捷見限論、餘奴傷主論、節要元文、限度宜忌、四日度論、四月度論、四木度論、四火度論、四土度論、四金度論、四水度論、倒限詳論、倒限拾遺、倒限總訣、劃度元奧經、諸煞秘要賦。張果星宗十七統論限說、諸煞倒限、劫煞歌斷、三煞歌斷、陽刃歌斷、亡神歌斷、的煞巳斷、的煞酉斷、的煞醜斷、飛廉歌斷、諸煞總斷、雜論倒限、倒限要訣、日月夾煞、善會日月、忌曜相攻、善星失用、將煞就煞、以煞見煞、出煞入煞、壽元失陷、暗氣加臨、論倒限歌、殺星帶刃、凶送凶迎、木星奪殺、前關後鎖、剛星帶戰、異宿相攻、聚殺交戰、眾殺反常、限入空關、太歲歌、論限附餘、流年論、流年都天賦、臨行歌、命身、命度、身度、限度、吉曜、害曜、值難、祿馬、四餘七政、金垣火殿、水殿木殿、土得位、日朔羅月望計、氣孛命羅計命、喬廟歌、木氣午酉、金火夜生、令星宜制、金水忌冬、望同忌晝、晝星忌夜夜星晝見、宜夜、宜晝、剛柔相濟、火羅夾金命天、雄星宜守財帛、計孛忌守田宅、得度得時失位失時、諸煞克命、凶空吉吉空凶、奴犯主有制吉、煞星克命限凶、刃迭凶主凶甚、飛刃為害、破碎限凶、鬼曜、一寸金總訣、日月金水、日子月午日虛月張、日月羅計、日月夾拱、官福朝陽日月陷弱、太陰在陷、諸星會惡朝天反吉、眾曜同宮強者為主、各宮一星命喜逢月、惡曜犯月、惡居妻位、羅星守命命在午遇羅、晝月臨兒夜日守子、限月娶妾金孛風月、四月卯時、十月酉時、羊刃惡星、自刃、五星空亡、碎金訣、父母早克、父母惡死、流落凶死、刀兵下死、遭刑法死、落水惡死、劫掠陣亡、被雷打擊、雷轟天誅、蛇傷、犬咬、顛疾、風疾、風顛、癩疾、火瘡、癆疾、喘嗽、虛?、黃疸、殘疾、六根不足、腰駝足跛、背屈口斜、雙盲、耳聾、唇缺、頸項癭瘤、音啞、面斑、毒藥喪身、木石壓傷、墜馬跌死、自縊懸樑、癰癤殘疾、六根不足、路亡法終、婢妾專權、小兒湯火、盜賊、畜類。'},
    '羅喉': {'命宮':'羅喉臨命位權勢，自能高少達中有，滯財名晚歲牢，若然入怒地，成敗屢經遭，晝遇限宮見，迎恩見貴豪。又曰：羅喉在命若何看，文武兼貪信不難。但得一星金與木，若非稟筆即登壇。此星得地，主大吉高貴，克吉凶不可言。', '財帛':'財帛之上是羅?，己財須得即方休。更若狂圖多富積，如何不破被奸偷。主平等亦主虛耗。', '兄弟':'第三宮內有羅喉，悖逆乖違可自憂。宗派同源恩義等，只因凶曜一時休。須有不如無，有則多兇惡。', '田宅':'羅?天首最兇殘，祖業雖多守則難。可惜田園千萬頃，都因凶曜見闌珊。主無祖業，有則多敗。', '男女':'羅喉臨照子宮時，戲彩盈門豈所宜。恰似花繁紅豔盛，寂然少有一留枝。', '奴僕':'羅喉難與善星交，奴僕之宮愈怒號。假使尊嚴崇道德，反居陋巷自簞瓢。主奴僕不安。', '妻妾':'羅喉凶宿名天首，不占高強對宮守。是惟一世有災迍，孤寡難婚更麤醜。主妻妾災疾。', '疾厄':'天首羅喉第八宮，世間何事比其凶。直饒食祿重重貴，面首須防有病攻。主多疾而有損。', '遷移':'羅喉凶曜號權星，臨照遷移回祿驚。得在旺宮為祿主，必因提薦貴身榮。回祿乃火星也。', '官福':'羅喉原是貴權星，四正居強最吉寧。運限逢之多吉慶，更延壽算享遐齡。此宮主貴而壽。', '福德':'天首羅喉為福德，超群出眾事乖張。合主瘟?兼盜賊，財空貧賤少年亡。主人物異常多疾而夭', '相貌':'天首羅喉相貌方，別為陰德解其殃。更兼忌曜縱橫見，若不相殘即系梁。主破相兇狠。'},
    '計都': {'命宮':'計都臨照命，性暴逞才能，背祖身孤立，依高附勢行，初年災禍起，晚歲福宜生，夜逢獨位照，家門財業成。又曰：計都暗曜最凶星，日月無光可畏人，得遇之宮加廟旺，雍容台輔股肱臣。', '財帛':'財帛之宮見計都，忽然富貴變為虛。莫教惡曜來侵犯，致使家囊掃地無。主財帛不興。', '兄弟':'昆仲宮中有計都，參商義薄有嗟籲。直饒四海皆同氣，各自營謀各自居。主兄弟不睦。', '田宅':'強宮之上計都侵，福祿消亡禍自深。祖業到頭都不管，空勞計較沒身心。主不住田宅。', '男女':'兒女宮中見計星，多因刑害大無情。雖然亦有二三個，也似梟鷹養不成。主兒女悖逆無成。', '奴僕':'計臨奴僕不堪言，不走還須損壽元。月孛會時偷盜散，家中消耗破田園。主招賊盜偷財。', '妻妾':'計都暗曜莫相逢，何況加臨對命宮。舉止乖張饒害克，定知造物不相容。主克妻，主妻不美。', '疾厄':'次弱之宮名疾厄，計都守此多刑克。若逢吉曜更加臨，無病卻為衣食迫。主多疾貧薄。', '遷移':'計都天尾照遷移，利害之端仔細推。出外迎祥因廟旺，不然平照定傾危。主出入不利。', '官福':'計都之宿最兇殘，官祿逢之利害間。若在廟方須貴重，丹墀廷諍逆天顏。士庶少吉、居官多害。', '福德':'天之首尾臨福德，平生凶事反為吉。坦然不忍妄加人，患難尤能拯危急。旺宮招吉。', '相貌':'計都加臨最不宜，平生戀酒被花迷。忽然更有忌星照，殘疾應須損四肢。此宮主傷殘。'}
  };
  var GE = {
    '太陽': '七政昭回日最尊，配人父道象人君，晨朝杲杲從東出，萬國葵傾暖似春，照人命守人身，員滿形容性又溫，言語殊常人仰重，處心無黨亦無嗔，或與水木相會合。文章卓斝動乾坤，金星同位好婚姻，財家財物送來頻，夜見土星晝見火，須防病患及尊親，首尾更來須惡死，紫氣緇流及道門，忽有孛星相邂逅，瘵癆說出病根源，臨財帛聚金銀田，宅多招好佃賓，閑極位中兄弟貴，子宮逢著只一人，六宮陷弱主克父，八宮一世沒災迍，西沒美妻顏似玉，九位逢之好遠行，官祿有官兼有祿，福宮一世自安寧，相貌之宮美顏色，細將星宿好推評。',
    '太陰': '太陰乃是水之精，纔出中天萬國明。初夜一輪光皓潔，人皆瞻仰快人情。配母道身從生，溫柔豐美好儀形，水日兩曜相交換，貴位居宜始見榮，歲德同宮賢聖善，外家送物不曾停，夜火會得延齡，晝生風癱母須刑，土星言語多遲吶，計羅眼目更無晶，金好色妻必淫不賢內正非禮。迎太乙若逢須庶出，紫氣阿母會通僧，居財帛陰貴成第三，閑極母康寧自身一世多閒逸，棠棣雖疏好弟兄，田宅位好簷楹。子息宮中是女星，奴僕出身多下賤，七宮妻妾貌娉婷，疾厄無刑少災疾，遷移偏是好遊行，若居官祿並福德，有官有福不虛稱，此宿若躔相貌宮，堂堂俊麗好儀容。',
    '歲星': '木星守命好容儀，眉目分明世所希，文學聰明多藝術，常懷仁義有尊卑，心少毒貌怡怡言談有德好珍奇，少病利官無險難，壽年長是及期頤，逢廟樂好官資，紫氣同宮筆吏司，三合遇之為福厚，對宮猶是好鎡基，太陽會合文章貴，女後同宮貴位推，夜火會主兵機，更逢土宿主旌旗。忌星若來須減力，金同文武佐明時，惟有水星科甲貴，性慵太乙懶施為，尾添惡首助威，孛同何以獨居之，財帛橫添須守得，閑極三人手足隨，田宅富豪高大廈，五宮偏見貴男兒，第六陷宮奴得力，那堪第七美顏妻，還居第八無災疾，第九他鄉得意歸，十位官資須顯赫。福宮壽老亦龐眉，十二位中為相貌，歲星躔此貌偏奇，前言敘盡神仙術，後學尤宜仔細推。女後太陰也，太乙孛星也，尾為計都星、首為羅?星。',
    '熒惑': '熒惑之星本日餘須分晝夜、別賢愚。夜生陰位兼逢廟，面見微黃、眉又疏，有武藝。會兵書言辭快猛，氣豪粗，形神上小下須大，秖好一身系武居，權握重掌兵機，生來財物又居儲，惟怕晝生陽宮分。面生權骨惡肌膚，眼大性剛多燥暴，常懷氣概立身軀、不招祖業資財散，博弄經紀及宰屠，逢日月事何如，爹娘早死莫嗟籲。木來俱備文兼武，土主英雄亂世徒，若會金星淫更佚，招妻產難定嗚呼。同水孛好穿窬，若逢計宿更遭誅，天首武臣高貴位，如臨紫氣號師巫，居財帛財帛虛，三宮兄弟主流徒，四位祖居多破蕩，六宮失火是家奴，五位男女須惡死，七宮妻妾亦先殂，疾厄瘟黃腰背曲，遷移商賈外州居，官祿位好憂虞，血光刑獄事區區，福德宮中人促壽，貌宮十相不全俱，微妙經書無價寶，珍藏待價莫輕諸。天首謂羅?星也。',
    '鎮星': '鎮宿本生戊己位安靜為尊象，厚地晝生惟愛。在陽宮相貌之宮主大鼻少言語多慳細硬直心腸有膽氣，順行度分廟宮中土地旌旗必雄，貴掌握貲財有福人，只怕夜生反為忌。留與逆尢可畏，刑克陰宮身更瘁不招祖業與貲財，四體多從苦憔悴居官惡處立其身博弄操刀能幹利，夜生人與日會克了賢尊難躲避。太陰母位不堅牢，若在下弦目障翳木來必定主文章火會遠行千里，余金若來妻早棄水星忌與刑同類，若逢紫氣懶慵人孛對雙盲，難看視首同陰位法場終尾會腰駝並背曲臨財應有外鄉。財三位徒流為昆季，田宅宮家易退子息，雖多不成器居奴僕引盜來偷西，沒主妻先作祟疾厄宮傷脾胃癰?風邪堪驚悸遷移作客，盜賊侵官祿重重主官事福宮晝見相貌，位自是英雄多膽志，須知此訣不尋常，後學得之莫道易。尾謂羅星首，謂計星西沒者妻宮也。',
    '太白': '金星潔靜好顏容，秀目疏眉白又紅，身短不長聲響喨，好耽音律習商宮，多淫欲美情悰，結交朋友久而恭，不奈是非長憫念，更于金鐵巧冶工，臨身自有將軍勢，照命兵權越是雄，妻財有世財同，因妻榮達不曾空，太陽遇貴人提挈，女主如逢母外通，水會之星淫更泆。火逢因色起災凶，日生木宿為豪貴，夜鎮令妻貌不中，天乙貴好相逢。游商出賈走西東。妻妾愛陪僧與道，孛來同枕患殘癃，天首若臨居武位，尾同至老是鰥翁。居財帛財帛豐，三宮兄妹是同宗，田宅陰人成卓立，五宮見女定重重，第六主妻多下賤，七宮妻妾送臨終，第八病時休針灸，遷移客女作家風，官祿妻宮有官蔭，福宮白發福無窮，第十二宮逢吉曜，其人定主美顏容，此是前賢微妙訣，後人仔細去研窮。',
    '辰星': '辰星快利有文章，形色清嚴色潤光，智慧聰明多妙巧，出群學問不尋常，情不定性溫良，遇圓則圓，方則方。樂廟若居申巳貴，他宮筆吏好心腸，日會父筵多酒食，相逢二母莫思量。木月見吉仍昌，李杜文章萬丈長，晝火若同貧且賤，刑克尤防上法場，夜土會主癱傷，金妻愛入別人房。天乙更貪修養術，彗來劫盜惡聲揚。首尾氣豪多勇毅，居財一似雪和湯，兄弟犯隔他鄉，田宮祖業破郎當。子息女多男巧妙。僕宮偷走急忙忙，妻位夫妻多外染，厄宮腰腎也羸?，遷移處好游商，官宮早歲甲科昂，福德自然多福，壽貌宮儼雅性溫良從頭說，盡人間事後學須教仔細詳。',
    '紫氣': '紫氣眾星中最善，形相分明人仰羨，心懷仁義性溫柔，作事與人為方便，無妒毒多謹願少病，利官長壽筭，好耽僧道立身孤，舉措施為慵更懶，太陽近貴作閒人，月會母親先化幻，夜火同時醫與巫，土木更來尤懶慢。金同妻妾是娼尼，水會智能稱俊彥，彗星分得賊人財。彗星即月孛也，能盜人財物，天首僧尼訟爭戰，天尾星同有機變。天尾星計都也，財位橫來財寶現，三宮姊妹或為僧，田宅高田主巨富，奴僕門下出緇流，子息須知女先見西沒宮中妻密情，更與別人情似線，八宮終不染時災，官位不曾見州縣，九宮游賈福宮閑，相貌為人性良善。',
    '月孛': '彗星威烈形似黑，彗掃帚星也。眉目精神光灼爍。神威鎮猛少言詞，膽氣麤雄心性惡。能運謀多禮樂，最有心機難測度。財多聚散一身孤，父母家財多索寞。金牛巨蟹及雙魚，寶瓶宮中好安著。堂堂容貌有威權，富貴崢嶸人驚愕。日月會事安著，父母兇狂先蓋槨。木來必定助威權，金會貪淫妻愛謔。男為巫術女為尼，水到穿窬入樓閣。土火亂世號英雄，紫氣更能修合藥。天首會，羅星為天首，好劫掠，天尾法場世拋卻。計星為天尾，居財臨宅破家貲，兄弟奴宮難檢約。疾厄腸風內主災，西沒五位都喪卻。官宮淩辱夭天年，十一宮中偏福薄。九宮飄泊相不全，依此推之終不錯。',
    '羅喉': '羅喉性格最為高，形相猙獰膽氣豪，不奈是非無?毒，日生陽位始堅牢，逢廟地有持操榮，加旌節有旗旄富貴，只宜陽位，立陰宮私合苦煎熬，日月會時人見蝕，須憂父母死難逃，金會助權好兵武，更防因色病成癆，水到財多逢賊盜，木來才調好風騷，土逆四支不是足，火持好殺弄鎗刀，兄弟不宜財破蕩，四宮賣卻祖東皋，子息位苦啼號，六宮妾本名春桃，妻位妻權中主克，九宮回祿厄難逃，官祿遇刑福德絕，相貌為軍破疾遭。',
    '計都': '計都本名兇惡曜，雙女白羊為好廟，面顏似火膽如神，骨相堂堂粗勇，貌有心機多巧妙。夜同陰宮宜守照，聲名顯赫有威風，掌握兵符權最要，在他宮力半效聚散，資財立身鬧經求，博算及屠沽心膽，情懷多執拗，見日月真好笑，父母無終深可吊。金來妻妾被人傷，土火徒流遂堪料，水來盜賊不良人。木氣宮中為吉兆，孛同斬首最為凶，財帛之中多計較，三宮昆仲惡中亡，四位金居曾火燎，子宜外姓及偏生，六位不堪乘馬跳，七宮妻克兩三人，疾病躔身難治療，官祿如逢獄裡亡，十一宮中福不紹，九宮沉滯相不全，此經妙處真元妙。'

    '太陽': '日月：日月同宮主舊聲，文章富貴有科名。晝夜分司兼旺廟，始知明主秉鈞衡。日木：日木同宮貴顯臣，平生多福少災迍。木星是主兼乘旺，必作當朝上貴人。日火：日火同宮失火炎，禍盈百六莫逃潛。天災遇此民遭厄，夭喪生民害義廉。日土：日土相逢慶瑞饒，天產人龍佐聖朝。星臨百六邦家泰，萬福攸同百禍消。日金：日金相遇福生民，必產奇材異世倫。百六會時天福熾，當知慶瑞在今辰。日水：日水相逢慶瑞盈，欣逢水日賀升平。人生值此人中瑞，間世奇才播大名。日氣：太陽紫氣喜相逢，潤澤生民稼穡豐。百六會時祥瑞應，人生會此必三公。日孛：日孛同宮最不嘉，只宜為旅不宜家。生逢白晝多災疾，夜則康寧無歎嗟。日羅：太陽正照被羅侵，父死他鄉兒沒親。先代家財多破盡，奔波衣食不如人。日計：日計相逢景福昌，官尊直諫佐明王。怕逢朔旦生奸偽，百六如逢大不祥。',
    '太陰': '月木：月木同宮瑞世兒，文章更得貴人知。如當百六真祥瑞，男主封侯女作妃。月火：月火同宮最不宜，平生好惹是和非。卻因繼母生災厄，壽至中年七十希。此為水火相克則少吉。月土：月土會遇大為災，偏產頑愚怪質骸。父母兩重人夭壽，忠臣失職竄天涯。此為土掩月之光，晦昧如此。月金：月金二宿喜相交，百六逢之慶瑞包。天產奇人扶社稷，官尊裂土與分茅。月水：月水相逢是福媒，人生遇此賦天才。溫純德厚榮尊爵，百六當之瑞慶來。月金月水本同一體，主人好貌聰明福貴。月氣：月氣相逢大吉祥，少年滿腹盡文章。若逢百六官高貴，福庇生民慶且昌。氣月同宮乃謂之祥雲捧月。月孛；月孛元來喜太陰，逢之必定長精神。如逢百六加祥瑞，為官必定主權人。月羅：太陰天首喜相遇，智將鷹揚塞外威。只恐望宵主叛逆，禍臨百六主傷悲。天首羅星也。月計：太陰天尾望宵同，爰產奸凶不孝忠。不在望時終有怪，投河毒藥或瘟逢。計為天尾星。',
    '歲星': '木火：木星會火喜偏饒，值此官尊福壽超，百六會時家國泰，忠臣孝子滿皇朝。火乃文明之象，與木同度，謂之木火通明。木土：木星宜與土同宮，百六逢之稼穡豐，會此乘軒並衣錦，記名青史著奇功。木會土有培養之功，所以主貴。木金：木星最喜遇金星，喜曜如逢百福興，百六會時多吉慶，人生指日到公卿。百六謂一百零六月之限度，方週一十二宮之數。木水：天命之宮木水星，一生聰俊播芳聲，三方更在高強位，金榜須排第一名。木水有資生之義。木氣：木星紫氣福偏隆，百六逢之慶不窮，更在廟宮陰德重，官居將帥伯侯同。氣乃本之餘，有主僕之義，且氣多能也。木孛：木星若也會欃槍，總有驚憂變吉祥，巨蟹宮中如會遇，少年榮折桂枝香。若在未宮相會，謂之木孛同泰。木羅：木與羅?同一舍，喜在陽宮分晝夜，晝則堂堂韓魏公，夜則魁梧呂僕射。宋韓琦封魏公呂端為僕射，皆正直之臣。木計：木星計若也相逢，反禍為祥千福集，百六當之福自添，如曆巨川舟楫至。',
    '熒惑': '火土：火土同宮主性凶，夜熒晝土福偏隆。強宮得地兼行順，萬戶侯封食萬鍾。火土相會有相生之義，故主富貴。火金：從來熒惑怕傷金，共照陰陽必主淫。更有惡星刑戰著，不過強仕即悲吟。金忌火傷，火旺金衰，金必受制，故不利。火水：火星逢水自相刑，怕在陽宮與晝生。不滿三旬防橫死，若能知命學修行。火與水本相克火，豈能勝之。有土則解。火氣：火星紫氣最廉平，百六逢之處福齡。逢生必是人間瑞，龍鳳叢中第一人。火主文明，氣主清高，必能富貴。火孛：熒惑最能誅孛彗，除掃欃槍為慶瑞。官榮上爵秉威權，百六逢之為富貴。攙搶孛之異名最能為禍，除之則太平。火羅：火星最忌見羅?，害義傷廉大可愁。兵火焚燒遭劫掠，金珠豐粟總無留。火與羅一氣之星遇之，如二虎豈得福乎。火計：火星最忌會計都，令人風疾怪形軀。如逢百六多才學，不向封侯也被誅。計乃天尾星與羅相對。',
    '鎮星': '土金：土星若也會金星，妻妾榮華福祿真。一躍龍門能變化，九州人物更多能。土與金會能生金，男以金為妻，故雲妻妾之榮。土水：土星若與水星同，舉世孤高膽志雄。秉節揮戈文武備，福臨百六慶無窮。土有止水之功。土氣：土星紫氣喜相依，冠冕榮身職位巍。丹赤忠心剛且毅，德施萬里足光輝。土孛：鎮星不要會攙搶，百六逢之禍害長。僻疾怪形須至孽，慵奴群小疾生殃。土羅：土星專惡會羅?，百六天災大可愁。人遇一生多困苦，瘟?病染坐亡囚。土計：土宿計都不可逢，人生淺薄更顓蒙。誅徒溺水兼癰患，百六天災萬種凶。',
    '太白': '金水：金水二星若相會，俯取官榮如拾芥。大凡遇此喜非常，百六逢之多吉泰。金水二星主清白廉潔。金氣：太白相逢紫氣星，彤庭光耀化鯤鯨。威加夷狄為真將，燮理陰陽佐帝庭。金孛：金星與孛若縱橫，百六逢之大吉亨。人產遇時須飽暖，家多金帛保康寧。金與孛皆女人之象，皆得其類。金羅：金星不喜會天首，狼戾奸凶為契友。富豪苗裔也卑微，百六當之殃不少。金與羅有相害。金計：金星設若逢天尾，奸計平生愚且詭。百六當之大不祥，財破人亡災病起。計性惡少有相和之義。',
    '辰星': '水氣：水星紫氣喜相當，天產斯文福勢昌。官爵顯榮家又富，千斯倉與萬斯箱。氣乃木之餘，有資生之力。水孛：辰星不欲相交彗，男則為奴女為婢。邪淫濁濫主貧寒，百計千謀無一遂。孛乃月之奴，主有如是。水羅：水星最忌與羅同，值此須教一世窮。不孝不忠多暴虐，不然瘖?與盲聾。水羅有不合之意。水計：水與計都相照會，缺唇跛足並駝背。或生癖疾女多淫，不入法場也徒配。計乃狠惡之星主人疾厄。',
    '紫氣': '氣孛：紫氣攙搶兩會期，慶來百福盡相宜。官居柱石人間瑞，澤及生民萬匯依。氣羅：紫氣羅?喜會同，人生剛毅足英雄。揮戈卻自平奸虜，笑取功勳反掌中。氣計：氣曜還同見計都，家多財帛富莊租。此宮人產天然福，百六逢之萬禍祛。',
    '月孛': '孛羅：孛星若會羅喉宮，勒石燕然紀大功。常人遇此必多災，百六逢之定主凶。孛計：月孛計都不可逢，人生淡泊主貧窮。偏招宿疾風癆厄，百六逢之不善終。'

    '太陽': {'角':'日躔角宿號天成，晚歲豐亨少亦貧。膽大心高超眾庶，前程端擬大聲名。角屬木得十二度。', '亢':'日躔亢宿號天柱，學問文章有今古。為人歡樂最賢豪，性識孤高名未遇。亢屬金得九度。', '氐':'日躔氐宿號天符，美貌堂堂出眾徒。性快心高多自耐，江湖漂泊少年孤。氐屬土得十六度。', '房':'日躔房宿號天祿，潔靜為人享清福。高才富學有聲名，耿介超群還不俗。房乃太陽之位得五度。', '心':'日躔心宿號天昌，白日生人福壽康。若至晚年尤享福，一生終是足衣糧。心乃太陰之位亦得六度。', '尾':'日躔尾宿號天枵，白日生人富益饒。性急多才人莫敵，夜生鄙俗事煩騷。尾屬火得一十八度。', '箕':'日躔箕宿號天魁，俊乂文章有大才。父母必須生貴子，官高位顯列三台。箕屬水得九度。', '斗':'日躔鬥宿號天明，剛勇方為膽氣英。產業經營辛苦置，老年豐富享安平。鬥屬木得二十四度。', '牛':'日躔牛宿號天機，機變尤長文藻馳。更得木生來贊助，榮貴聲名天下知。牛屬金得六度。', '女':'日躔女宿號天德，清秀聰明多智識。天文元象性孤奇，白日生人最為吉。女屬土得一十度。', '虛':'日躔虛宿號天司，耿直聰明膽氣兼。白日生人多富盛，夜生逢此足迍邅。虛日鼠太陽之位得九度。', '危':'日躔危宿號天隆，性直文章學問豐。營運資財難積蓄，老年方見免災凶。危月燕乃太陰之殿，得一十五度。', '室':'日躔室宿號天福，膽氣權謀性多欲。平生安樂少災迍，父母康健延金穀。室火豬得一十七度。', '壁':'日躔壁宿水金連，皓魄相同福自綿。祿馬更來相會聚，果然折得桂花鮮。壁水貐得九度。', '奎':'日躔奎宿號端守，富貴榮華年壽久。文章高貴眾難加，白日生人福自有。奎木狼得一十八度。', '婁':'日躔婁宿號天宮，大尹公卿將相逢。年少便膺居鼎鼐，生時值此必興隆。婁金狗得一十二度。', '胃':'日躔胃宿號天解，令德性賢位安泰。脾疾冷涎身有壽，日生卻得年高邁。胃土雉得一十五度。', '昴':'日躔昴宿號天房，耐事經營足食糧。才略機謀多智策，稱為當世一賢良。昴日雞乃太陽之位，得一十度。', '畢':'日躔畢宿號天強，賢德才高萬事昌。音律善通憂慮少，心多嗜欲行無良。畢月烏乃太陰之位得一十六度。', '觜':'日躔觜宿號天鈞，足祿多能享世榮。學問淵源才挺出，此人名必播朝廷。觜火猴借得一度。', '參':'日躔參宿號天水，冷淡持身欲不累。多才多學富聲名，官宮有祿終須貴。參水猿得十度。', '井':'日躔井宿號天弼，冠世文章增福力。公侯卿監世間榮，福祿恩波傳子息。井木犴得三十一度。', '鬼':'日躔鬼宿號天流，先代資財用不休。巧計機關人莫測，心閑多事出陰謀。鬼金羊得二度。', '柳':'日躔柳宿號天梁，仕宦須令仕本鄉。金帛豐盈多積蓄，晚年須見祿榮昌。柳土獐得一十二度。', '星':'日躔星宿號流澤，卿相當朝須得力。三方主曜旺高強，富貴柴華聲赫赫。星日馬太陽之位，得六度。', '張':'日躔張宿號天正，才智聰明文武並。官星得力善星居，祿貴兼全增吉慶。張月鹿乃太陰之位，得一十六度。', '翼':'日躔翼宿號天婁，賢德文才出智謀。若得木星同位此，定應官職守清幽。翼火蛇得一十九度。', '軫':'日躔軫宿號天階，年少功名自鼎來。端潔為人須大量，定須九棘與三槐。軫水蚓得一十七度。'},
    '太陰': {'角':'月躔角宿號天貴，學問淵源須大智。多才慈惠更溫良，夜裡生人最為利。', '亢':'月躔亢宿號天璣，富貴榮華人好異。平生安樂足豐榮，妻妾容顏更奇美。亢屬金與月會則金月皆有貌主吉。', '氐':'月躔氐宿名天劫，性急多嗔又乘劣。日生兵火須逢難，若是夜生衣祿絕。', '房':'月躔房宿號天祥，文昌學問更蕃昌。出眾機謀多計巧，平生衣祿壽須長。', '心':'月躔心宿號天韉，運用機謀智未全。少年未脫生涯計，如臨晚景始安然。心乃月之本位主平等。', '尾':'月躔尾宿號天宗，勇智多謀膽氣雄。穿窬剽掠心常有，見木方教免禍凶。', '箕':'月躔箕宿號天財，冠古窮今學問該。但得對宮逢吉曜，文星得地應儒魁。', '斗':'月躔鬥宿號天封，偉望威名學問通。君子逢之須得祿，小人遇此走西東。此為木月清貴之格。', '牛':'月躔牛宿號天蔭，作事施為要沉審。性直溫良少苦辛，纔過中年便安穩。牛金牛會月，有相生之義。', '女':'月躔女宿號天寶，學問聰明多智巧。文章冠世早登榮，遷官必定居廊廟。', '虛':'月躔虛宿號天常，有貌多才更善良。衣食豐盈倉庫實，聲名閭裡自揄揚。', '危':'月躔危宿號天文，磊落襟懷少比倫。為人玷污多奸巧，圖畫機關行不真。月在危化天文星，主人巧智多奸。', '室':'月躔室宿號天鸞，形貌清奇富且安。更得木星同位立，直須奏對近天顏。', '壁':'月躔壁宿號天華，語言蹇滯事沉思。若遇蝕神兼月孛，主鬚生長在寒微。', '奎':'月躔奎宿銘肝腸，不勞餘力至員郎。要得吉神居十位，定應台輔佐君王。月水相生主此。', '婁':'月躔婁宿號天垣，旺廟之中福祿全。君子遷官居祿顯，小人衣食旺莊田。月金會度主此。', '胃':'月躔胃宿號天印，十度之中貴無並。更兼金木又同行，金榜題名官一品。月土會度主此。', '昴':'月躔昴宿號天光，平生官祿不尋常。聰明才貌超今古，異日須為給諫郎。', '畢':'月躔畢宿號天明，峻字雕牆樂太平。更得金星來照助，少年及第占魁名。畢月烏月之本度所以為吉。', '觜':'月躔觜宿號天女，富足之人更有官。賢淑生來形貌美，此身自在不勝歡。觜火猴度下火升殿主吉。', '參':'月躔參宿號天官，俊乂宏才學問寬。富足慈仁心好善，貴人和色對天顏。水月同度，主人多智有才貌。', '井':'月躔井宿號天充，夜生輕巧性奸雄。愛說是非心不定，文章必定是虛空。', '鬼':'月躔鬼宿號天鸞，好樂之宮每事安。得力相生官位吉，公卿要路上金鑾。鬼金羊度月之本宮。', '柳':'月躔柳宿號天觚，德行清高愛讀書。聰俊文詞人最重，聲名揚赫帝王都。月行柳度二三度為月掛柳梢，五度之外非是。', '星':'月躔星宿號天節，歡樂雖多病磨折。貪慳財物行無良，性急多嗔有災厄。', '張':'月躔張宿號天曹，才力經營志氣高。形貌端方榮貴早，晚年又見福堅牢。張月鹿月之本度。', '翼':'月躔翼宿號天迍，雖然祿位也艱辛。骨肉分離難保守，又知壽夭是元因。', '軫':'月躔軫宿號天理，勇智多端文學取。少年辛苦老豐隆，赫奕聲名傳萬里。'},
    '熒惑': {'角':'火躔角宿號天娼，衣食隨時不善良。害子克妻婚難合，免教衣食見恓惶。角十度、十一度、十二度凶，已前不妨。', '亢':'火躔亢宿號天戈，妻妾宮中有折磨。好色損妻心不定，此人衣食必奔波。劃度雲亢一二三度，見火不利。', '氐':'火躔氐宿號天輕，衣食生來不稱情。心性輕狂多膽志，晚來方可得安寧。', '房':'火躔房宿號天梁，官職超遷輔弼良。將相公侯名必貴，此身佩紫與金章。房日兔之度，太陽之位，火乃太陽精必顯。', '心':'火躔心宿號天相，統領兵機為上將。更兼樞府四十年，富貴功名徹天上。心月狐之度卯為火位，火明天蠍。', '尾':'火躔尾宿號天穆，此人必定榮衣祿。安然納福不賓士，超騰晚景最多福。尾火虎火之本度。', '箕':'火躔箕宿號天明，作事機權性最靈。為官必得君王寵，大任終當領萬兵。箕水度本與火不合，寅木生火故榮。', '斗':'火躔鬥宿號天征，生殺之權有大聲。祿旺中年主富貴，三公位至播芳名。鬥木獬度，木乘火旺，則有施為。', '牛':'火躔牛宿號天朽，先代家資盡滅亡。形貌魁梧多智勇，此生終羨少年郎。牛金牛之度，火與金有相害，故少吉。', '女':'火躔女宿號天暗，多成多敗心狂亂。若非木旺在宮扶，六親害盡資財散。女土蝠將近坎位，火亦不明。', '虛':'火躔虛宿號天磨，貧困初年財不多。心愛是非耽女色，更添女子不相和。', '危':'火躔危宿號天淋，好色貪花智勇深。破祖離家自成立，施恩終是福重興。危月燕太陰之度，故有好色貪花句。', '室':'火躔室宿號天強，勇智操持武職良。更得木星來資助，定須學館作文章。室火豬度，遇木有相資之義。', '壁':'火躔壁宿號天滅，兄弟兒孫道路絕。伶仃孤苦萬千般，晚景稍可身安悅。壁水貐度水火本不合，安得有榮乎。', '奎':'火躔奎宿號天廚，衣祿生來自有餘。勇義智高才學美，威名應許達皇都。奎木狼度，能助火之威。', '婁':'火躔婁宿號天暘，命裡逢之出外襄。恩德又施兼有道，淵源學向翰林場。婁金狗度，火之本宮，故不克主吉。', '胃':'火躔胃宿號天沒，定是終身無子息。中間困苦又艱難，奔走東西漫勞役。胃土雉度，火旺於戌，胃四度至酉皆不利，惟火羅吉。', '昴':'火躔昴宿號天鏤，身蹇身孤性又愚。貪酒多淫心不足，到頭衣食亦無餘。昴日雞太陽之度，酉乃金旺、火必有損。', '畢':'火躔畢宿號天危，身見災迍必損妻。破蕩家貲遊冶客，貲財耗盡走東西。畢月烏之度為天危，畢星好雨則傷火。', '觜':'火躔觜宿號天淫，風花雪月四時行。浮泛自然家業破，賓士晚歲始身榮。', '參':'火躔參宿號天倫，火性顛狂好損身。工巧細心兼有志，做些陰騭與兒孫。參乃申宮水主之，火不能勝之。', '井':'火躔井宿號天中，智慧威嚴膽氣雄。衣食平平人命蹇，晚年方始見亨通。', '鬼':'火躔鬼宿號天祥，家富因何乏子郎。只怨天年多夭折，不然惡死沒家鄉。鬼金羊之度，因火克之。', '柳':'火躔柳宿號天池，多慮多疑多是非。克子克妻兄弟絕，平生衣食卻隨時。', '星':'火躔星宿號天榮，必定前程有大聲。更得十宮星得力，為官穩穩到公卿。星日馬太陽之度，火到此度，定主榮華。', '張':'火躔張宿號天頡，汩沒平生難共說。若非壽夭二親亡，克子傷妻兄弟缺。', '翼':'火躔翼宿號天憐，心性倡狂學有成。智術多端加嗜欲，生平衣食主多情。翼火蛇火之本度，謂之性惡。', '軫':'火躔軫宿號天暴，手足風狂多顛倒。晚年衣食稍平安，只恐妻兒命難保。軫屬水火化暴星，其性急而多凶。'},
    '鎮星': {'角':'土躔角宿名天壽，蓋世文章冠魁首。經綸事業富胸襟，不是公卿主富有。角屬木土有資培之功，故曰壽。', '亢':'土躔亢宿號天仁，博厚文章達帝京。廊廟之中官極貴，蠻夷安鎮得清平。亢乃金度土遇之、有生養之義。', '氐':'土躔氐宿號天牢，命限逢之孤且高。年少定應傷骨肉，中年榮貴免煎熬。氐土貉土之本殿。', '房':'土躔房宿號天信，少年作事苦勞神。語言誠實人多厚，男女難招食貴人。', '心':'土躔心宿號天忌，情性遲疑最有靈。疾病纏身雖夭壽，全無義氣性慵平。主人性懶心慵、多病癡愚。', '尾':'土躔尾宿號天奇，百六逢之必有依。若是忌星須促壽，又須參考本根基。尾火也火土有相依之象。', '箕':'土躔箕宿號天彬，衣食豐隆卻稱情。官位若逢貴星照，國家掌判有聲名。', '斗':'土躔鬥宿號天樞，事業文章富有餘。台鼎任中朱紫貴，定須象簡與金魚。', '牛':'土躔牛宿號天侗，心性溫和衣祿豐。若是夜生多蹇滯，身多下賤處貧窮。牛金牛土能生之，晝生人多吉。', '女':'土躔女宿號天常，柔順機謀足食糧。勞力經營心有慮，生來只恐父先亡。', '虛':'土躔虛宿號天冠，好樂之宮出貴官。四九度中登宰輔，重金重紫列朝班。土樂之宮更虛日度得朝陽也。', '危':'土躔危宿廟堂窠，祿厚財豐事不訛。舉措施為多利便，言柔語順性溫和。', '室':'土躔室宿名天伏，福厚財豐衣祿足。多男多女有資財，家道安然富金穀。金谷晉石崇園名其中花草珍奇異物皆富有也。', '壁':'土躔壁宿號天異，祿馬豐盈有權位。身名遠播定安榮，官祿吉星宜大貴。', '奎':'土躔奎宿號天津，貧賤奔波損父娘。若是中年貧苦至，晚年方可足衣糧。', '婁':'土躔婁宿號天騁，土婁須要木相逢。婁木雖高非土壯，刀鎗之下走西東。', '胃':'土躔胃宿號天磨，財物充盈滿倉庫。難婚終是少男兒，不貴仍須還大富。胃土雉度土之類、主有積也。', '昴':'土躔昴宿名天伏，平生須食貴人祿。多因胥吏得榮名，將相聲名人畏服。昴日度太陽也，伏者潛藏之象。', '畢':'土躔畢宿號天回，能通經術足錢財。中年便得文章力，必主兒孫擅大才。', '觜':'土躔觜宿號天模，父母先亡身早孤。衣食平平身汨沒，此身應懶讀詩書。觜火猴度、主人性急身懶。', '參':'土躔參宿號天津，立世經營業未興。男女尤如行路客，貴人得祿一番新。參水猿度、主人蹇澀不通。', '井':'土躔井宿號天驪，命若逢之心似癡。若習文章應費力，此生衣食也微微。井木犴度、下', '星':'土星相會木必傷之。', '鬼':'土躔鬼宿號天文，縱有資財化作塵。男主須防無上下，一生不足曆艱辛。鬼金羊度下，主性狠不足。', '柳':'土躔柳宿號天稽，無祿無財又損妻。若是日生衣食足，晚年終是色沉迷。夜生行此度平薄克陷，晝生者可也。土星：土躔星宿號天途，父貴兒榮事不虛。只恐夜生脾疾苦，日生應可足金珠。星日馬太陽之度，土主晝生人富貴。', '張':'土躔張宿號天娥，信行為人事不訛。年少淹滯中主貴，形神肥厚足田禾。張月鹿太陰之度，主先凶而後吉。', '翼':'土躔翼宿號天然，經術雖通性不堅。會有文章身不貴，聲名遠播足威權。翼火蛇度有變化之機。', '軫':'土躔軫宿號天箋，才藝皆通至老年。未得文章求發跡，只將經術保身全。軫水蚓土制之，所以不為富貴。'},
    '太白': {'角':'', '星':'金星躔角號天清，年少登科擅大名。衣祿生平豐且厚，為官清貴佐朝廷。角木蛟度金本制之所以其本宮。', '亢':'金躔亢宿號天昌，挺出英才姓字香。文武兼全為宰輔，定應旌節受恩光。亢金龍度主比和為福。', '氐':'金躔氐宿號天將，少失尊親性自剛。衣祿文章全自得，莫教貪欲損爹娘。氐土貉有生金之理。', '房':'金躔房宿名天角，衣祿生來殊不薄。為人多義更方圓，形貌端莊又多學。房日兔度金藉陽光主榮顯。', '心':'金躔心宿號天孚，繈褓之時身亦孤。處已溫良心好欲，文章腹內一些無。心月狐度主，性靈多欲媚人。', '尾':'金躔尾宿號天殃，骨肉資財定見傷。若不修仙並積德，定須夭壽見恓惶。尾火虎性狠主傷克。', '箕':'金躔箕宿號天彤，妻子乖離吉見凶。家計縱然饒富足，老年不免又貧窮。箕水豹度金，乃不得地之宮又能耗氣。', '斗':'金躔鬥宿號天銓，貪色貪財行不賢。男女雖多終是克，更無衣食少安全。鬥木獬度金，本克之故雲貪財。', '牛':'金躔牛宿號天繩，色欲多貪命裡淫。衣食生來自豐足，晚年優裕享安寧。牛金牛度金得滿用。', '女':'金躔女宿號天奸，多女多男自少閑。若是十宮星得力，何愁此地不為官。', '虛':'金躔虛宿號天編，美貌豐容福壽綿。災害不侵黃耇老，隨時衣祿自然全。', '危':'金躔危宿號天兢，溫儉忠良性自清。文學定須因女富，文星入命出官身。危月燕度金，月有光輝之依主吉。', '室':'金躔室宿號天勳，必主遷官近帝君。聲振四方持節鉞，位登樞密大尊榮。室火豬度金，得鋾鎔而為大器。', '壁':'金躔壁宿號天光，彭祖年時壽命長。若是女人財喜旺，豐容美貌嫁才郎。壁水貐度主，金白水清。', '奎':'金躔奎宿名天厭，未遂功名身不賤。為人溫厚更寬容，性識孤高多有見。', '婁':'金躔婁宿號天薨，必定為人少失親。酒色是非應不免，晚年富貴樂平生。婁金狗金之同度。', '胃':'金躔胃宿號天端，命若逢之五品官。任是兵刑兼法令，定須出入侍金鑾。胃土雉度土，有生金之功。', '昴':'金躔昴宿號天璋，為官進速任關梁。卿監位中名早得，也須腰紫佩金章。昴日雞太陽度也，金水有護太陽之力。', '畢':'金躔畢宿號天聯，赫奕功名近帝前。不作外台觀察使，須登廊廟職升遷。畢月烏度下，正得清輝之象。', '觜':'金躔觜宿號天營，冠世文章出眾群。翰苑聲名詞藻麗，也須上國立功勳。觜火猴度金之得祿之所，應主大貴。', '參':'金躔參宿號天晶，學問詞鋒冠世英。若是官宮星得力，定須貴籍早標名。金水之清在此，宮此度見之。', '井':'金躔井宿是吉宮，高才博學福豐隆。為官定是居廊廟，福及蒼生祿萬鍾。井木犴犴獸也，主英勇掌牢獄之星有威權。', '鬼':'金躔鬼宿號天淫，婦女逢之有外心。戒行不循迷酒色，平生衣食自來臨。鬼金羊金之同度。', '柳':'金躔柳宿號天關，快樂平生衣食閑。男女更多人貴重，豐盈財物性尤寬。柳土獐度下土能生金之度亦無患。金星：金躔星宿號天熒，理義精通學冠群。更若火星來會此，是非酒色不堪聞。', '張':'金躔張宿號天暘，財物多貪行不良。若是妻遲難得子，平平衣食壽延長。張月鹿度與金度皆女人之象。', '翼':'金躔翼宿號天英，學問文章顯大名。經術更能修顯著，此身榮貴樂平生。翼火蛇度金水逢蛇則吉。', '軫':'金躔軫宿號天程，口舌輕狂凶害生。言語不真心氾濫，多端非禮有奸名。軫水蚓度與金無害。'},
    '辰星': {'角':'水躔角宿號天成，清秀文章學術明。喜怒無常心不定，平生衣祿自豐盈。角木蛟度水能生之。', '亢':'水躔亢宿號天津，容貌清奇通道術。心清閒暇作文章，多智多能善音律。亢金度為水潤金明。', '氐':'水躔氐宿號天旨，言語聰明知道體。人情好惡性能通，遇吉終須文學貴。', '房':'水躔房宿號天淫，智識聰明太古心。衣祿自然情氾濫，文章學術有人欽。房日兔度主文業吉利。', '心':'水躔心宿號天淩，清潔為人快性情。巧計多修文業事，聰明才藝兩三分。心月狐度主人惟靈。', '尾':'水躔尾宿號天澄，理義該通學術明。資財耗散多災否，惟恐風狂疾染身。尾火虎度水火木不相合。', '箕':'水躔箕宿號天淫，快樂心閑樂自真。衣食平生財亦足，文詞道藝細評論。箕水豹度水同其類。', '斗':'水躔鬥宿名天德，俊譽文章心耿直。榮貴子孫和且樂，豐衣足食語言澀。鬥木獬度水能生之。', '牛':'水躔牛宿號天甄，和氣交朋益子孫。機密謀為人不識，多財應得外人屯。牛金牛度金水相生，故有益。', '女':'水躔女宿號天驛，眼疾朦朧是貴人。好學貪財多議論，平生衣食也艱辛。女土蝠度土實', '虛':'水虛。水虛：水躔虛宿號天馴，清潔為人財亦勻。多技多能心亦善，弟兄孝順樂天倫。虛日鼠度水易相護。', '危':'水躔危宿號天中，語澀心難眼半朧。中末之年方得力，外人財物稍寬容。危月燕度下水月相映。', '室':'水躔室宿號天攸，文學聰明智慧優。曆事未能心預測，筭籌多計樂閑幽。', '壁':'水躔壁宿號天池，智慧多能有志機。元象天文多洞達，平生衣食不相虧。壁水貐與水同度得比和。', '奎':'水躔奎宿號天淩，忠直為人急性情。財祿自然多積聚，平生多事不安寧。', '婁':'水躔婁宿號天斯，耿直為人不受欺。衣祿豐盈多稱意，一生快活少凶危。', '胃':'水躔胃宿號天泓，耿介為人記事明。忠孝存心多執拗，為人衣祿未安寧。', '昴':'水躔昴宿號天闉，容貌清奇識五音。心謀巧計事沉靜，衣祿平平禍不侵。昴日雞度下平等無傷。', '畢':'水躔畢宿號天淋，曆事三思性又欽。容貌清奇衣食厚，文才學問滿胸襟。水月主好相而清潔。', '觜':'水躔觜宿號天樞，清白為人好讀書。多藝多才多智巧，平生歡樂遠行居。觜火猴度水之得地。', '參':'水躔參宿正廟居，文星入廟要囚扶。水宿聰明多好動，囚能自執不凶虞。參度至申水之廟旺。', '井':'水躔井宿號天潯，心好清閒智量深。籌筭文章人薦用，聲名遠播在儒林。', '鬼':'水躔鬼宿號天洪，好靜為人更美容。心內洞明兼道釋，眾人欽敬樂無窮。', '柳':'水躔柳宿號天注，柔善為人處世當。能作文章心巧計，聲名閭裡有稱揚。', '星':'水躔星宿號天清，伏見皆能官職增。與日同宮須大用，定為喉舌玉街行。水陽相會大利。', '張':'水張；水躔張宿號天榮，富貴雙全性又靈。文武相兼皆並用，賢能兄弟佐朝廷。', '翼':'水躔翼宿號天異，年少登科文學濟。清華要路驟遷榮，與日同行須大貴。', '軫':'水躔軫宿號天岑，文學之官眾所欽。謀略聰明人倚重，才華藻思入儒林。水之廟旺。'},
    '紫氣': {'角':'氣躔角宿號天休，機智清閒藝術優。僧道逢人多吉慶，庶人不系若虛舟。', '亢':'氣躔亢宿號天僮，性善文章藝術通。不獨為官井富旺，神仙快樂福無窮。', '氐':'氣躔氐宿號天環，雲水留心自得閒。耿介孤高人自傲，只宜仙道坐山間。心留雲水性染煙霞。', '房':'氣躔房宿號天沖，清福平生孰與同。道釋白衣消息好，資財衣祿卻豐隆。處世優遊豐衣足食。', '心':'氣躔心宿號天德，元象天文須會德。儒門釋典自能通，子孫雖有終須克。物外消遙閑中風月。', '尾':'氣躔尾宿號天淵，心性豪強克陷纏。謀略威權人莫測，聲名忠義史書傳。膽壯心雄威名赫赫。', '箕':'氣躔箕宿號天循，智識機謀果毅深。性直文章聲遠播，貴人相遇有知音。心性剛果文思深長。', '斗':'氣躔鬥宿號天斛，飄然孤潔為清福。文章忠直外安閒，朋友柔和衣食足。心逸身安清名林下。', '牛':'氣躔牛宿號天輪，尊重清高害六親。金火逢之官顯赫，如逢木月富豪人。閑中風月個裡乾坤。', '女':'氣躔女宿號天瑞，耿介孤高性獨明。但得吉星居十位，必為廊廟福蒼生。秉直敦素獨顯清朝。', '虛':'氣躔虛宿號天文，清秀為人近至尊。骨肉難為自孤潔，達人僧道樂衡門。優遊歲月洞達風流。', '危':'氣躔危宿號天侗，章服平生與貴同。說地談天心曉悟，逍遙樂道在崆峒。身居隱逸笑傲煙霞。', '室':'氣躔室宿號天元，道釋儒流性自然。經術從來胸臆悟，文才洞徹事神仙。閑中樂道性裡談元。', '壁':'氣躔壁宿號天覺，機智文章更多學。更能籌筭悟天機，舉錯能為應不錯。多學多文能謀能幹。', '奎':'氣躔奎宿號天乙，性直忠良又煩急。平生多是不安閒，不受人欺財聚積。心直而性急，忙裡且生財。', '婁':'氣躔婁宿號天虛，骨肉無緣克害疏。自是緇黃遮體服，清閒衣食樂虛無。空門而守靜，禪榻以安閒。', '胃':'氣躔胃宿號天音，衣祿生來必稱心。妻子宮中難聚會，四方交友自同襟。非術士之客亦九流之士。', '昴':'氣躔昴宿號天端，重厚為人命亦寒。耿介性情難得犯，家門忠孝百行安。聲名頗重仁義同和。', '畢':'氣躔畢宿號天吉，天乙居中加福力。為人清秀善為文，官祿星扶進爵秩。貌俊神清文而且貴。', '觜':'企氣躔觜宿號天福，衣食安然百事足。金珠財寶自天來，妻子難為帶孤獨。足食而優遊，鰥寡且孤獨。', '參':'氣躔參宿號天瓊，終是為官貴且榮。性直忠良參相位，文章事業四方聞。振聲名於天下，扶日月於楓宸。', '井':'氣躔井宿號天令，文武雙全才更敏。參樞給諫盡功名，官職崇高年壽永。懷文武之全才，包機謀之大略。', '鬼':'企氣躔鬼宿號天榮，積善之家有此人。富貴崇高聲遠振，官途起越旺門庭。樂富貴以安然，在官家而度日。', '柳':'氣躔柳宿號天平，好靜溫良免禍生。衣食平平無破敗，子孫終是不相親。稟性孤高生平淡薄。', '星':'氣躔星宿號天強，命中若遇定孤孀。財旺家門自興盛，若為僧道壽延長。宿梅花之紙帳，坐禪榻之風光。', '張':'氣躔張宿號天芒，克害妻兒命裡當。縱有高才心又急，晚年方可免恓惶。一生孤寂寞，半世且郎當。', '翼':'氣躔翼宿號天牢，命宮若值定孤高。生計為謀多費力，若為僧道自逍遙。邀山間之明月，樂林下之清風。', '軫':'氣躔軫宿號天嗟，孫子豐隆後必乖。命若逢之身獨喜，此人衣食稍寬懷。'},
    '月孛': {'角':'孛躔角宿號天壘，情性聰明豐貌美。貪淫好酒心不賢，殺害傷妻須克子。丰姿飄逸人聰巧樂，酒眠花性更奢。', '亢':'孛躔亢宿號天微，心毒如蛇事事危。易喜易嗔心不定，此生定是損妻兒。作惡如狼虎，行藏似鼠蛇。', '氐':'孛躔氐宿號天僉，凡事施為細且纖。更得官星來救助，朱衣紫綬萬人瞻。處世俗而且細，成功業得安然。', '房':'孛躔房宿號天瞻，身命逢之樂自然。武略文韜居顯宦，功名更立主威權。', '心':'孛躔心宿號天祗，官職榮遷祿位宜。百里郎官名位著，參謀半刺著緋衣。立綱常而有理，施國法且多為。', '尾':'孛躔尾宿號天該，家道興隆慶自來。身命逢之官祿至，將軍公輔蘊三才。修德以興家，蓄威而鎮國。', '箕':'孛躔箕宿號天華，燕國相逢定性奢。官祿連遷趨貴顯，金珠財物富豪家。情性奢華官尊而富。', '斗':'孛躔鬥宿號天囂，面上波濤口訥調。不是過房須有克，貪花愛酒賭錢消。面起風波而口中和美。', '牛':'孛躔牛宿號天風，孤寡徒刑性更凶。若教疾病纏身上，免得生離不善終。孤陋寡聞而多生疾厄。', '女':'孛躔女度名暗星，毒害顛狂損六親。柳陌花街遊冶客，只愁老後更伶仃。心懷狠毒而好貪淫，到老而孤。', '虛':'孛躔虛宿號天智，萬事施為皆遂意。宮班富貴旺門庭，只恐六親無一二。有興家創業之能，遂利求名之志。', '危':'孛躔危宿號天姱，命若逢之旺一家。不是官榮須富盛，妻宮子位不籲嗟。旺門庭而有福，居富室樂妻孥。', '室':'孛躔室宿號天杖，及到雙魚為正旺。逢之富貴必超榮，定作朝廷公與相。著朱衣而過天門，主富貴而增榮顯。', '壁':'孛躔壁宿號天巴，旺地逢之到一家。身命逢之徒說好，到頭不免事如麻。一生平淡而一世悽惶。', '奎':'孛躔奎宿號天便，賣盡田園賭盡錢。不是酒兮須博奕，貪花浮浪苦憂煎。主窮困而少達，酒色以忘身。', '婁':'孛躔婁宿號天邪，年少浮游浪裡花。寬緩性情心不定，平生終少病災加。主虛浮而度日。', '胃':'孛躔胃宿號天翰，性急情寬事少閑。只恐為官年不永，若居貧困壽如山。貧而有壽而身勞碌。', '昴':'孛躔昴宿號天喜，命若逢之姿貌美。妻宮損克兩三重，祿位須逢升玉陛。主人清秀而風流，若至遷官並進職。', '畢':'孛躔畢宿號天詵，富貴生平主有聲。超越仕途雲路早，朱衣紫綬相儒名。生平多富貴，一路顯芳名。', '觜':'孛躔觜宿號天真，秀氣文章自立身。年少登科官進早，性情容易便生嗔。英俊聰明而少年發達。', '參':'孛躔參宿號天銓，官祿須逢抵不難。妻子宮中須有克，更兼夭壽在蒼顏。主克妻而壽夭。', '井':'孛躔井宿號天誑，衣祿生來須大旺。資財恐是別人收，有子終須還破蕩。貧而且蹇與人少睦。', '鬼':'孛躔鬼宿號天詫，巨富官榮兩無價。為人毒害更英雄，先有聲名大權伯。主有貴有權。', '柳':'孛躔柳宿號天沖，將相功勳祿萬鍾。威望從來台憲任，蜚聲騰達顯英雄。名榮爵顯位尊德重。', '星':'孛躔星宿號天戎，定斷妻兒三兩重。執拗為人心猛勇，生來衣食老無終。一生貧苦老後無終。', '張':'孛躔張宿號天權，妻子宮中未保全。衣食生來自豐足，性情高尚作忠良。平生耿介處世優遊。', '翼':'孛躔翼宿號天嘩，此是星辰到本家。喜怒不常多色欲，心如狼虎毒如蛇。主兇狠。', '軫':'孛躔軫宿號天忒，戀酒貪花好游奕。家財破盡好行偷，若不投軍須有克。非戎貝之客即穿窬之人。'},
    '羅喉': {'角':'羅躔角宿號天模，性直機謀出眾徒。家道自如心莫妄，限扶終久是良圖。謀略深遠，每事如心。', '亢':'羅躔亢宿號天般，藏物心懷亦且寬。特達機謀人仰羨，晚年衣食恐難安。少年穎異，老後無終。', '氐':'羅躔氐宿號天攜，命若逢之必損妻。頭女長男須要克，資財卻免散東西。主虛花刑克', '房':'羅躔房宿號天從，大富資財膽氣雄。文武兼全官五品，兵刑之任福偏濃。富而且貴。', '心':'羅躔心宿號天辰，巨祿高才出眾人。巧計多知剛果毅，威名遠服四夷賓。威鎮四夷。', '尾':'羅躔尾宿號天畋，命裡逢之有重權。上將論功心好殺，何愁此地不為官。', '箕':'羅躔箕宿號天聰，廟旺之宮祿早逢。百萬兵師歸統禦，金吾衛上及三公。主兵權。', '斗':'羅躔鬥宿號天磨，命若逢之福亦多。智慧機謀能出眾，也須財利帶奔波。心性虛靈、平生勞碌。', '牛':'羅躔牛宿號天韉，剛毅能為主重權。相貌豐隆髭滿面，妻兒先損謾機圓。有官有職、克子克妻。', '女':'羅躔女宿號天巡，午亥生人立大勳。廊廟之中須大任，其它衣食且平平。', '虛':'羅躔虛宿號天鏐，甲命生人位列侯。身命若逢衣食旺，到頭終是喜清幽。先貴而後隱。', '危':'羅躔危宿號天樗，肥厚身材更有須。藏事心機財亦旺，自成自立免憂虞。克苦成家、先難後易。', '室':'羅躔室宿號天躔，出眾超群有大權。作事操持心耿直，若逢酉命是高賢。尚志好禮、異於土俗。', '壁':'羅躔壁宿號天持，機智文章計出奇。通達天文榮且貴，多能多壽譽名馳。名譽文章、且富貴芳聲。', '奎':'羅躔奎宿號天威，情性焦煩不受欺。猛烈為人心鯁直，狼貪婪妒食衣肥。直而貪濫。', '婁':'羅躔婁宿號天志，抗直傷人兼有義。多招閑是與閑非，衣食生來心未遂。一生平淡。', '胃':'羅躔胃宿號天懌，記問淵源性剛直。小人此位亦威權，君子逢之進官職。文武兼通、終能富貴。', '昴':'羅躔昴宿號天蜻，出眾機權多好勝。初年須破晚方成，果毅操持有權柄。先主凶而後主吉。', '畢':'羅躔畢宿號天危，言語倡狂惹是非。克害妻兒君莫怨，平生衣食也隨時。', '觜':'羅躔觜宿號天申，亥命逢之是喜神。家道興隆金玉富，為官應許侍楓宸。', '參':'羅躔參宿號天津，稟性清閒心洞明。籌策自能知道釋，眾人欽仰振威名。胸中蘊藉、方外聲名。', '井':'羅躔井宿號天空，怒地平生運不通。若得木星同在度，木羅相愛卻無凶。先難而後易，始貧而終安。', '鬼':'羅躔鬼宿號天昌，機變文章志氣揚。形貌魁崇腰且厚，子孫應是保安康。足富貴而優遊。', '柳':'羅躔柳宿號天鰥，愛樂林泉智在山。胸次文章才廣博，猶如僧道喜清閒。隱逸之士。', '星':'羅躔星宿號天圓，命若逢之權自專。法令兵刑堪任重，文韜武略兩皆全。智能之士。', '張':'羅躔張宿號天目，命若相逢多發福。威名遠播鎮邊疆，帥相居朝榮貴祿。文出而武歸。', '翼':'羅躔翼宿號天愚，心毒藏機語不虛。巧妙性情容貌美，貴人親近得安居。主人伶俐近貴。', '軫':'羅躔軫宿號天神，武職之官此位逢。生殺之權心自縱，金吾節度兩班同。懷報國之心而居大位。'},
    '計都': {'角':'計躔角宿號天沖，五星逢之立見凶。惡暴性情尤毒烈，倡狂促壽法刑中。兇惡無忌。', '亢':'計躔亢宿號天戈，軍陳成功福未多。不是兵機軍健輩，定須自縊與投河。先主吉而後主凶。', '氐':'計躔氐宿號天通，東出尤宜十度中。若對命宮聲遠著，更逢吉曜福豐隆。遇吉而主貴。', '房':'計躔房宿號天迍，兄弟難為並子孫。晝日陽宮應且破，隨教禍害已臨門。刑害破家。', '心':'計躔心宿號天嗤，狡猾無凶出賤卑。性急謀高難耐事，須知夭壽少年時。謀為有計心險年促。', '尾':'計躔尾宿號明星，百計千方巧性靈。若是火同身且貴，自然文學有聲名。此度得吉。', '箕':'計躔箕宿號天世，不招祖業自身孤。心懷巧計多奸猾，衣食生平亦少無。', '斗':'計躔鬥宿號天梁，智慧聰明子息強。會得文章須近貴，佳名端可四方揚。此度主吉。', '牛':'計躔牛宿號天常，丰采堂堂性格良。更得善星同在度，垂紳搢笏侍君王。此度牛金牛主大貴。', '女':'計躔女宿號天遷，為福須為土地官。躔在度初為大貴，遷官美任定非難。主職近本方。', '虛':'計躔虛宿號天流，父母須逢骨肉售。若見孛星同會此，定知處處夜行偷。此度主虛耗。', '危':'計躔危宿號天游，衣食艱辛事事憂。克子損妻家破散，平生孤苦不舒愁。主人少樂多勞。', '室':'計躔室宿號天真，性烈官高位不輕。若得木星來救助，為官七品至公卿。主清貴。', '壁':'計躔壁宿號天魚，四度之間十度居。正廟之中官極貴，十年之內位金吾。金吾掌天子之禁。', '奎':'計躔奎宿號天雄，木月逢之近帝宮。火土若逢凶且咎，終為亂世賊臣中。主奸惡。', '婁':'計躔婁宿號天垣，旺廟之中定主權。體貌堂堂威望重，功勳將相主王公。主威武成功。', '胃':'計躔胃宿號天刑，日裡逢之怕火拼。若不雕青文被面，定須犯法必為兵。此度主刑囚。', '昴':'計躔昴宿要星扶，初限元來懶讀書。只可就來刀劍上，將軍位列至金吾。主兵職官。', '畢':'計躔畢宿號天征，天上呼為一典刑。得地逢之終是吉，前程遠大有聲名。主刑名之職。', '觜':'計躔觜宿號天扶，僧道之人定是孤。苦見財星三合照，不為牙儈販商夫。平常少福勞碌孤苦。', '參':'計躔參宿號天歡，水宿相逢作美官。庶俗也當回避此，定知毒惡不相安。會水局主貴。', '井':'計躔井宿號天沖，命度逢之立見凶。若在祿宮尤見喜，提兵百萬逞英雄。惟官祿旺宮主吉有威。', '鬼':'計躔鬼宿號旌旗，威武兵權立見機。君子逢之官品貴，小人剝面有凶危。', '柳':'計躔柳宿號天災，命裡逢之大見乖。骨肉分離財破散，父南子北不和諧。此度多疾病、又不相和。', '星':'計躔星宿號天鞍，命若逢之有祿官。庶俗化為文秀士，凶星一見刃傷殘。士人主吉，庶人主凶。', '張':'計躔張宿號天孤，病苦貧窮莫歎籲。妻子身邊無一個，耳聾眼疾作殘夫。主孤苦疾害。', '翼':'計躔翼宿號天蛇，性毒心凶身刺花。惡事更兼重複見，不然心亂好淫邪。主心險性惡。', '軫':'計躔軫宿號天強，官職須教訓練場。節度兵刑須大佐，才猷奮迅佐朝堂。節度即今總兵之官。'}
  };
  function chan(y, su) { return (CHAN[y] || {})[su] || null; }
  function count() { var n = 0; for (var y in CHAN) n += Object.keys(CHAN[y]).length; return n; }
  return { ZONG: ZONG, JIAO: JIAO, CHAN: CHAN, chan: chan, count: count };

/* 論十二宮 —— 據《張果星宗》正文，11 篇 3,235 字（命宮無專篇，其義見身命主論）。照錄原文。 */

     如身命主及得用之星，宜旺不宜衰，須是升殿居垣方不以衰論也。」
   「凡對宮有剋星曰沖，如木在丑、金在未，對克之類。
     凡克本命及身度主之星曰制，如金為命，羅火制之；月為身，土計傷之之類。

  var WANG = { 春: '木', 夏: '火', 秋: '金', 冬: '水', 季: '土' };   // 季＝四季月（土旺於四季）
  var SHUAI = { 春: '土', 夏: '金', 秋: '木', 冬: '火' };

  }

  /* ============ 生辰解析 ============ */
  function readInput() {
    return {
      y: +$('y').value, m: +$('m').value, d: +$('d').value,
      hh: +$('hh').value, mi: +$('mi').value,
      lon: parseFloat($('lon').value), lat: parseFloat($('lat').value),
      ts: $('ts').checked
    };
  }
  function resolve(v) {
    var jdUT0 = XY.toJD(v.y, v.m, v.d, v.hh + v.mi / 60 - 8);
    var corr = 0, eq = 0;
    if (v.ts) { eq = XY.eqTime(jdUT0 + XY.deltaT(v.y) / 86400); corr = (v.lon - 120) * 4 + eq; }
    var jdUT = jdUT0 + corr / 1440;
    return { jdUT: jdUT, jdTT: jdUT + XY.deltaT(v.y) / 86400, corr: corr, eq: eq };
  }
  function ayan(jdTT) { return XY.ayanamsaLahiri(jdTT); }

  /* ============ 定位 ============ */
  $('loc').addEventListener('click', function () {
    var b = $('loc'); b.textContent = '定位中…';
    if (!navigator.geolocation) { b.textContent = '此裝置不支援定位'; return; }
    navigator.geolocation.getCurrentPosition(function (p) {
      $('lon').value = p.coords.longitude.toFixed(3);
      $('lat').value = p.coords.latitude.toFixed(3);
      b.textContent = '已取得所在地';
      setTimeout(function () { b.textContent = '用我目前的位置'; }, 2500);
    }, function () { b.textContent = '定位被拒或失敗，請手動填'; });
  });

  /* ============ 宿曜：本命 ============ */
  function fourTracks(jdTT, lm, ld) {
    var lam = XY.moonLon(jdTT), ay = ayan(jdTT);
    return { lam: lam, ay: ay, trop: XYD.suByLon(lam), sid: XYD.suByLon(lam - ay), jia: XYD.guFaJia(lm, ld), yi: XYD.guFaYi(lm, ld) };
  }
  function trackTable(t) {
    var r = [
      ['望宿法', '經書主算法（卷下·史瑤初譯）', t.jia.name, '依農曆日推，二十七宿', 'tag j'],
      ['月建圖', '經書另一套（卷上·景風新譯）', t.yi.name, '依農曆日推，二十八宿含牛', 'tag'],
      ['真月·經文錨', '今日天文算法', t.trop.name, '月亮實際黃經 ' + t.lam.toFixed(2) + '°，春分點定為婁宿起點', 'tag'],
      ['真月·恆星錨', '今日天文算法', t.sid.name, '再扣掉歲差 ' + t.ay.toFixed(2) + '°', 'tag']
    ];
    var h = '<table><tr><th>算法</th><th>本命宿</th><th>依據</th></tr>';

        + '<td class="su">' + esc(x[2]) + '</td><td class="tiny">' + esc(x[3]) + '</td></tr>';
    });
    return h + '</table>';
  }

      + 'L' + p3[0].toFixed(1) + ' ' + p3[1].toFixed(1) + 'A' + r1 + ' ' + r1 + ' 0 ' + lg + ' 0 ' + p4[0].toFixed(1) + ' ' + p4[1].toFixed(1) + 'Z';

    try { renderQZ(); } catch (e) { $('outQZ').innerHTML = '<div class="err">錯誤：' + esc(e.message) + '</div>'; }
    try { renderRing(); } catch (e) { }
  }
  $('go').addEventListener('click', function () { runAll(); try { renderRi(); } catch (e) { } try { renderXian(); } catch (e) { } });

  (function boot() {
    var n = new Date();
    $('dy').value = n.getFullYear(); $('dm').value = n.getMonth() + 1; $('dd').value = n.getDate();
    try { renderIntro(); } catch (e) { }
    try { renderLookup(); } catch (e) { }
    try { renderWenXY(); } catch (e) { }
    try { renderWenQZ(); } catch (e) { }
    runAll();
    try { renderRi(); } catch (e) { }
    try { renderXian(); } catch (e) { }
  })();
  window.FUSION = { selfCheckXY: selfCheckXY, selfCheckQZ: selfCheckQZ, selfCheckMerge: selfCheckMerge };
})();

</script>
